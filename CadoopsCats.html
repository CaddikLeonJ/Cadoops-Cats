<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cadoops' Cats</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#87b8d8;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none} body{position:fixed;inset:0}
canvas{display:block;position:absolute;left:0;top:0;width:100%!important;height:100%!important}
#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 4px #0008}
#brand{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;font-weight:800;font-size:20px}
#ver{font-size:12px;opacity:.8;margin-top:2px}
#status{position:absolute;top:max(14px,env(safe-area-inset-top));right:16px;font-size:13px}
#stick{pointer-events:auto;position:absolute;left:24px;bottom:max(28px,env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;background:#ffffff28;border:2px solid #ffffff55}
#knob{position:absolute;left:34px;top:34px;width:50px;height:50px;border-radius:50%;background:#ffffffaa}
.btn{pointer-events:auto;position:absolute;border:0;border-radius:50%;background:#ffffffaa;color:#222;font-weight:800;box-shadow:0 3px 10px #0004}
#jump{right:24px;bottom:max(32px,env(safe-area-inset-bottom));width:78px;height:78px}
#run{right:116px;bottom:max(42px,env(safe-area-inset-bottom));width:62px;height:62px}
#hint{position:absolute;bottom:max(122px,calc(env(safe-area-inset-bottom) + 122px));right:20px;font-size:12px;opacity:.85}
</style></head><body>
<div id="hud"><div id="brand">Cadoops' Cats<div id="ver">Prototype v0.0.5</div></div><div id="status">Loading 3D world…</div><div id="stick"><div id="knob"></div></div><button class="btn" id="jump">JUMP</button><button class="btn" id="run">RUN</button><div id="hint">Drag anywhere else to turn camera</div></div>
<script type="module">
const status=document.getElementById('status');
try{
 const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x91bdd6);scene.fog=new THREE.Fog(0x91bdd6,18,45);
 const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.05,100);
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);function resizeRenderer(){const w=Math.max(1,document.body.clientWidth||innerWidth),h=Math.max(1,document.body.clientHeight||innerHeight);renderer.setSize(w,h,false);renderer.domElement.style.width=w+'px';renderer.domElement.style.height=h+'px';camera.aspect=w/h;camera.updateProjectionMatrix()}resizeRenderer();requestAnimationFrame(resizeRenderer);setTimeout(resizeRenderer,100);setTimeout(resizeRenderer,500);
 scene.add(new THREE.HemisphereLight(0xfff4df,0x64745e,2.1));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(5,9,4);sun.castShadow=true;scene.add(sun);
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(24,24),new THREE.MeshStandardMaterial({color:0xcaa97c,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
 const grid=new THREE.GridHelper(24,24,0x8f7659,0xb79a76);grid.position.y=.004;scene.add(grid);
 const wallMat=new THREE.MeshStandardMaterial({color:0xe8dfd0});function box(x,y,z,w,h,d,mat=wallMat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
 box(0,1.5,-8,16,3,.25);box(-8,1.5,0,.25,3,16);box(8,1.5,0,.25,3,16);const sofaMat=new THREE.MeshStandardMaterial({color:0x667b70});box(-3,.45,-3,3.5,.8,1.3,sofaMat);box(-3,1,-3.55,3.5,1.1,.25,sofaMat);
 const cat=new THREE.Group(),fur=new THREE.MeshStandardMaterial({color:0x25282a,roughness:.85}),white=new THREE.MeshStandardMaterial({color:0xf4f1e8,roughness:.9});
 function part(g,p,s,mat=fur){const m=new THREE.Mesh(g,mat);m.position.set(...p);m.scale.set(...s);m.castShadow=true;cat.add(m);return m}
 part(new THREE.SphereGeometry(.5,20,14),[0,.48,0],[.75,.72,1.15]);part(new THREE.SphereGeometry(.38,20,14),[0,.72,.48],[.9,.9,.85]);part(new THREE.ConeGeometry(.16,.34,3),[-.22,1.02,.49],[1,1,1]);part(new THREE.ConeGeometry(.16,.34,3),[.22,1.02,.49],[1,1,1]);part(new THREE.SphereGeometry(.18,16,10),[0,.63,.77],[1.15,.75,.35],white);
 [[-.27,.24,.28],[.27,.24,.28],[-.27,.24,-.38],[.27,.24,-.38]].forEach(p=>part(new THREE.CylinderGeometry(.10,.12,.45,12),p,[1,1,1],white));const tail=part(new THREE.CylinderGeometry(.08,.12,1.05,12),[0,.67,-.72],[1,1,1]);tail.rotation.x=-1;cat.position.set(0,0,2);scene.add(cat);
 let yaw=0,vy=0,onGround=true,run=false;const move={x:0,y:0};const stick=document.getElementById('stick'),knob=document.getElementById('knob');let sid=null;
 function stickMove(e){const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy)||1,max=42,k=Math.min(1,max/len);knob.style.transform=`translate(${dx*k}px,${dy*k}px)`;move.x=dx/Math.max(max,len);move.y=dy/Math.max(max,len)}
 stick.addEventListener('pointerdown',e=>{sid=e.pointerId;stick.setPointerCapture(sid);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)stickMove(e)});function endStick(e){if(e.pointerId===sid){sid=null;move.x=move.y=0;knob.style.transform=''}}stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);
 const runBtn=document.getElementById('run');runBtn.addEventListener('pointerdown',()=>run=true);['pointerup','pointercancel','pointerleave'].forEach(x=>runBtn.addEventListener(x,()=>run=false));document.getElementById('jump').addEventListener('pointerdown',()=>{if(onGround){vy=4.1;onGround=false}});
 let lookId=null,lastX=0;renderer.domElement.addEventListener('pointerdown',e=>{lookId=e.pointerId;lastX=e.clientX;renderer.domElement.setPointerCapture(lookId)});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId===lookId){yaw-=(e.clientX-lastX)*.008;lastX=e.clientX}});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});
 const clock=new THREE.Clock();status.textContent='Test Room • Cat ready';
 function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.033),speed=run?4.2:2.2;const f=-move.y,r=-move.x;if(Math.abs(f)+Math.abs(r)>.04){const a=yaw+Math.atan2(r,f);cat.position.x+=Math.sin(a)*speed*dt;cat.position.z+=Math.cos(a)*speed*dt;cat.rotation.y=a;cat.position.x=Math.max(-7.3,Math.min(7.3,cat.position.x));cat.position.z=Math.max(-7.3,Math.min(7.3,cat.position.z))}
 vy-=9.8*dt;cat.position.y+=vy*dt;if(cat.position.y<=0){cat.position.y=0;vy=0;onGround=true}const target=cat.position.clone().add(new THREE.Vector3(0,.62,0));const offset=new THREE.Vector3(Math.sin(yaw)*-3.3,1.65,Math.cos(yaw)*-3.3);camera.position.lerp(target.clone().add(offset),.12);camera.lookAt(target);renderer.render(scene,camera)}animate();
 addEventListener('resize',resizeRenderer);addEventListener('orientationchange',()=>setTimeout(resizeRenderer,150));
}catch(e){status.textContent='3D load failed'}
</script></body></html>
