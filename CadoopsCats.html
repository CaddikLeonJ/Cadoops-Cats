<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cadoops' Cats</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#87b8d8;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none} body{position:fixed;inset:0}
canvas{display:block;position:absolute;left:0;top:0;width:100%!important;height:100%!important}
button,#hud,#stick,#knob,#hint,#brand,#ver,#status{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{appearance:none;-webkit-appearance:none}
#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 4px #0008}
#brand{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;font-weight:800;font-size:20px}
#ver{font-size:12px;opacity:.8;margin-top:2px}#age{font-size:12px;opacity:.9;margin-top:3px}
#status{position:absolute;top:max(14px,env(safe-area-inset-top));right:16px;font-size:13px}
#stick{pointer-events:auto;position:absolute;left:24px;bottom:max(28px,env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;background:#ffffff28;border:2px solid #ffffff55}
#knob{position:absolute;left:34px;top:34px;width:50px;height:50px;border-radius:50%;background:#ffffffaa}
.btn{pointer-events:auto;position:absolute;border:0;border-radius:50%;background:#ffffffaa;color:#222;font-weight:800;box-shadow:0 3px 10px #0004}
#jump{right:24px;bottom:max(32px,env(safe-area-inset-bottom));width:78px;height:78px}
#run{right:116px;bottom:max(42px,env(safe-area-inset-bottom));width:62px;height:62px}
#hint{position:absolute;bottom:max(122px,calc(env(safe-area-inset-bottom) + 122px));right:20px;font-size:12px;opacity:.85}
</style>
</head>
<body>
<div id="hud">
  <div id="brand">Cadoops' Cats<div id="ver">Prototype v0.0.9</div><div id="age">Kitten • 10 weeks</div></div>
  <div id="status">Loading 3D world…</div>
  <div id="stick"><div id="knob"></div></div>
  <button class="btn" id="jump">JUMP</button>
  <button class="btn" id="run">RUN</button>
  <div id="hint">Drag anywhere else to turn camera</div>
</div>

<script type="module">
const status=document.getElementById('status');
const ageLabel=document.getElementById('age');
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());

try{
  const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');

  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x91bdd6);
  scene.fog=new THREE.Fog(0x91bdd6,18,45);

  const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.05,100);
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  document.body.prepend(renderer.domElement);

  let lastViewW=0,lastViewH=0;
  function resizeRenderer(force=false){
    const rect=renderer.domElement.getBoundingClientRect();
    const w=Math.max(1,Math.round(rect.width||document.body.clientWidth||innerWidth));
    const h=Math.max(1,Math.round(rect.height||document.body.clientHeight||innerHeight));
    if(!force && w===lastViewW && h===lastViewH)return;
    lastViewW=w; lastViewH=h;
    renderer.setSize(w,h,false);
    camera.aspect=w/h;
    camera.updateProjectionMatrix();
  }
  resizeRenderer(true);
  requestAnimationFrame(()=>resizeRenderer(true));
  setTimeout(()=>resizeRenderer(true),100);
  setTimeout(()=>resizeRenderer(true),500);
  setTimeout(()=>resizeRenderer(true),1200);

  scene.add(new THREE.HemisphereLight(0xfff4df,0x64745e,2.15));
  const sun=new THREE.DirectionalLight(0xffffff,2.25);
  sun.position.set(5,9,4);
  sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  scene.add(sun);

  const floor=new THREE.Mesh(
    new THREE.PlaneGeometry(24,24),
    new THREE.MeshStandardMaterial({color:0xcaa97c,roughness:.92})
  );
  floor.rotation.x=-Math.PI/2;
  floor.receiveShadow=true;
  scene.add(floor);

  const grid=new THREE.GridHelper(24,24,0x8f7659,0xb79a76);
  grid.position.y=.004;
  scene.add(grid);

  const wallMat=new THREE.MeshStandardMaterial({color:0xe8dfd0,roughness:.9});
  function box(x,y,z,w,h,d,mat=wallMat){
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    m.position.set(x,y,z);
    m.castShadow=m.receiveShadow=true;
    scene.add(m);
    return m;
  }

  box(0,1.5,-8,16,3,.25);
  box(-8,1.5,0,.25,3,16);
  box(8,1.5,0,.25,3,16);

  const sofaMat=new THREE.MeshStandardMaterial({color:0x667b70,roughness:.9});
  box(-3,.45,-3,3.5,.8,1.3,sofaMat);
  box(-3,1,-3.55,3.5,1.1,.25,sofaMat);

  // --- Cat model / life-stage rig ---
  const cat=new THREE.Group();
  cat.position.set(0,0,2);
  scene.add(cat);

  // The visible model lives under a separate rig so age can change proportions
  // without affecting world position, physics or facing.
  const catRig=new THREE.Group();
  cat.add(catRig);

  const black=new THREE.MeshStandardMaterial({color:0x202326,roughness:.9});
  const white=new THREE.MeshStandardMaterial({color:0xf1efe8,roughness:.96});
  const pink=new THREE.MeshStandardMaterial({color:0xd68d89,roughness:.8});
  const innerEar=new THREE.MeshStandardMaterial({color:0xb86f73,roughness:.85});
  const eyeMat=new THREE.MeshStandardMaterial({color:0x9fbf62,roughness:.32,metalness:.03});
  const pupilMat=new THREE.MeshStandardMaterial({color:0x060606,roughness:.42});

  function mesh(parent,geometry,material,pos,scale=[1,1,1],rot=[0,0,0]){
    const m=new THREE.Mesh(geometry,material);
    m.position.set(...pos);
    m.scale.set(...scale);
    m.rotation.set(...rot);
    m.castShadow=true;
    m.receiveShadow=true;
    parent.add(m);
    return m;
  }

  // Body references are kept so they can gradually change with age.
  const torso=mesh(catRig,new THREE.SphereGeometry(.5,22,16),black,[0,.58,-.05],[.70,.66,1.22]);
  const shoulders=mesh(catRig,new THREE.SphereGeometry(.36,20,15),black,[0,.67,.44],[.86,.88,.92]);
  const chest=mesh(catRig,new THREE.SphereGeometry(.25,18,13),white,[0,.55,.48],[.72,1.08,.40]);

  const head=new THREE.Group();
  head.position.set(0,.88,.68);
  catRig.add(head);
  const headMesh=mesh(head,new THREE.SphereGeometry(.34,22,17),black,[0,0,0],[1,.94,.95]);

  const muzzleL=mesh(head,new THREE.SphereGeometry(.14,16,12),white,[-.095,-.085,.285],[.94,.76,.62]);
  const muzzleR=mesh(head,new THREE.SphereGeometry(.14,16,12),white,[ .095,-.085,.285],[.94,.76,.62]);
  const nose=mesh(head,new THREE.SphereGeometry(.062,14,10),pink,[0,-.045,.382],[1.05,.68,.82]);

  const earL=mesh(head,new THREE.ConeGeometry(.155,.32,3),black,[-.205,.275,.015],[1,1,.70],[0,0,-.05]);
  const earR=mesh(head,new THREE.ConeGeometry(.155,.32,3),black,[ .205,.275,.015],[1,1,.70],[0,0,.05]);
  mesh(head,new THREE.ConeGeometry(.09,.205,3),innerEar,[-.205,.277,.040],[1,1,.52],[0,0,-.05]);
  mesh(head,new THREE.ConeGeometry(.09,.205,3),innerEar,[ .205,.277,.040],[1,1,.52],[0,0,.05]);

  const eyes=[];
  function addEye(x){
    const eye=new THREE.Group();
    eye.position.set(x,.055,.298);
    head.add(eye);
    mesh(eye,new THREE.SphereGeometry(.072,15,11),eyeMat,[0,0,0],[1,.88,.38]);
    mesh(eye,new THREE.SphereGeometry(.034,12,9),pupilMat,[0,0,.030],[.42,1,.30]);
    eyes.push(eye);
  }
  addEye(-.13);
  addEye(.13);

  const legs=[];
  function makeLeg(x,z,isFront){
    const leg=new THREE.Group();
    leg.position.set(x,.44,z);
    catRig.add(leg);
    mesh(leg,new THREE.CylinderGeometry(.078,.09,.36,10),black,[0,-.16,0],[1,1,1]);
    mesh(leg,new THREE.SphereGeometry(.102,12,9),white,[0,-.355,.045],[1.02,.58,1.34]);
    leg.userData.isFront=isFront;
    legs.push(leg);
    return leg;
  }
  makeLeg(-.235,.38,true);
  makeLeg( .235,.38,true);
  makeLeg(-.235,-.42,false);
  makeLeg( .235,-.42,false);

  const tailRoot=new THREE.Group();
  tailRoot.position.set(0,.69,-.61);
  catRig.add(tailRoot);

  const tailSegments=[];
  let tailParent=tailRoot;
  for(let i=0;i<6;i++){
    const seg=new THREE.Group();
    seg.position.set(0,0,i===0?0:-.21);
    tailParent.add(seg);
    mesh(seg,new THREE.CylinderGeometry(.052-i*.004,.070-i*.004,.27,10),black,[0,.02,-.12],[1,1,1],[Math.PI/2,0,0]);
    tailSegments.push(seg);
    tailParent=seg;
  }
  tailRoot.rotation.x=-.34;

  // --- Age / growth ---
  // Prototype clock is deliberately accelerated so growth can actually be tested:
  // 1 real minute = 4 in-game weeks. The final game will use the chosen lifespan setting.
  let ageWeeks=10;
  const AGE_WEEKS_PER_SECOND=4/60;
  let lifeStage='Kitten';
  let ageAdultness=0;
  let visualScale=.54;
  let stamina=1;
  let tired=false;

  const LIFE_STAGES={
    Newborn:{min:0,max:4},
    Kitten:{min:4,max:26},
    Adolescent:{min:26,max:52},
    Adult:{min:52,max:416},
    Senior:{min:416,max:Infinity}
  };

  function clamp01(v){return Math.max(0,Math.min(1,v))}
  function smooth01(v){
    v=clamp01(v);
    return v*v*(3-2*v);
  }
  function mix(a,b,t){return a+(b-a)*t}

  function stageForAge(w){
    if(w<4)return 'Newborn';
    if(w<26)return 'Kitten';
    if(w<52)return 'Adolescent';
    if(w<416)return 'Adult';
    return 'Senior';
  }

  function formatAge(w){
    if(w<52)return Math.max(1,Math.floor(w))+' weeks';
    const years=w/52;
    if(years<2)return years.toFixed(1)+' years';
    return Math.floor(years)+' years';
  }

  function updateGrowth(){
    lifeStage=stageForAge(ageWeeks);

    // adultness is 0 at birth and reaches 1 at one year old.
    ageAdultness=smooth01(ageWeeks/52);

    let overall;
    if(ageWeeks<4){
      overall=mix(.28,.43,smooth01(ageWeeks/4));
    }else if(ageWeeks<26){
      overall=mix(.43,.68,smooth01((ageWeeks-4)/22));
    }else if(ageWeeks<52){
      overall=mix(.68,1.0,smooth01((ageWeeks-26)/26));
    }else{
      overall=1.0;
    }

    // Our playable kitten starts intentionally much smaller than the old v0.0.8 cat.
    visualScale=overall;
    catRig.scale.setScalar(overall);

    // Kittens have a larger rounder head, larger eyes, short muzzle and short legs.
    const youth=1-ageAdultness;
    const headRel=mix(1.0,1.28,youth);
    head.scale.setScalar(headRel);

    const eyeRel=mix(1.0,1.22,youth);
    eyes.forEach(e=>e.scale.setScalar(eyeRel));

    const muzzleDepth=mix(1.0,.72,youth);
    muzzleL.scale.z=.62*muzzleDepth;
    muzzleR.scale.z=.62*muzzleDepth;
    nose.position.z=mix(.382,.355,youth);

    const legY=mix(1.0,.70,youth);
    legs.forEach(leg=>{
      leg.scale.y=legY;
      leg.position.y=mix(.44,.395,youth);
    });

    // Body lengthens and becomes less round as the kitten matures.
    torso.scale.z=mix(1.22,1.08,youth);
    torso.scale.y=mix(.66,.72,youth);
    shoulders.scale.z=mix(.92,.86,youth);

    // Tail begins a little shorter and finer.
    const tailRel=mix(1.0,.76,youth);
    tailRoot.scale.set(tailRel,tailRel,tailRel);

    // Senior cats keep adult size but carry themselves a little lower.
    if(lifeStage==='Senior'){
      catRig.position.y=-.025;
      head.position.y=.855;
    }else{
      catRig.position.y=0;
    }

    ageLabel.textContent=lifeStage+' • '+formatAge(ageWeeks);
  }
  updateGrowth();

  // --- Controls ---
  let cameraYaw=0;
  let vy=0;
  let onGround=true;
  let runHeld=false;
  let currentSpeed=0;
  let movePhase=0;
  const move={x:0,y:0};
  let idlePhase=0;

  const stick=document.getElementById('stick');
  const knob=document.getElementById('knob');
  let sid=null;

  function stickMove(e){
    const r=stick.getBoundingClientRect();
    const dx=e.clientX-(r.left+r.width/2);
    const dy=e.clientY-(r.top+r.height/2);
    const len=Math.hypot(dx,dy)||1;
    const max=42;
    const k=Math.min(1,max/len);
    knob.style.transform=`translate(${dx*k}px,${dy*k}px)`;
    move.x=dx/Math.max(max,len);
    move.y=dy/Math.max(max,len);
  }

  stick.addEventListener('pointerdown',e=>{
    e.preventDefault();
    sid=e.pointerId;
    stick.setPointerCapture(sid);
    stickMove(e);
  });
  stick.addEventListener('pointermove',e=>{
    if(e.pointerId===sid)stickMove(e);
  });
  function endStick(e){
    if(e.pointerId===sid){
      sid=null;
      move.x=move.y=0;
      knob.style.transform='';
    }
  }
  stick.addEventListener('pointerup',endStick);
  stick.addEventListener('pointercancel',endStick);

  const runBtn=document.getElementById('run');
  runBtn.addEventListener('pointerdown',e=>{e.preventDefault();runHeld=true});
  ['pointerup','pointercancel','pointerleave'].forEach(x=>runBtn.addEventListener(x,()=>runHeld=false));

  document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();
    if(onGround && lifeStage!=='Newborn'){
      // Kittens start with a smaller hop and gain jump strength as they mature.
      const jumpStrength=mix(2.85,3.95,ageAdultness)*(lifeStage==='Senior'?.86:1);
      vy=jumpStrength;
      onGround=false;
    }
  });

  let lookId=null,lastX=0;
  renderer.domElement.addEventListener('pointerdown',e=>{
    lookId=e.pointerId;
    lastX=e.clientX;
    renderer.domElement.setPointerCapture(lookId);
  });
  renderer.domElement.addEventListener('pointermove',e=>{
    if(e.pointerId===lookId){
      cameraYaw-=(e.clientX-lastX)*.007;
      lastX=e.clientX;
    }
  });
  renderer.domElement.addEventListener('pointerup',e=>{
    if(e.pointerId===lookId)lookId=null;
  });
  renderer.domElement.addEventListener('pointercancel',e=>{
    if(e.pointerId===lookId)lookId=null;
  });

  function angleDelta(a,b){
    return Math.atan2(Math.sin(b-a),Math.cos(b-a));
  }

  const clock=new THREE.Clock();
  const camPos=new THREE.Vector3();
  status.textContent='Test Room • Cat ready';

  function animate(){
    requestAnimationFrame(animate);
    resizeRenderer();
    const dt=Math.min(clock.getDelta(),.033);

    ageWeeks+=AGE_WEEKS_PER_SECOND*dt;
    updateGrowth();

    const inputMag=Math.min(1,Math.hypot(move.x,move.y));
    const moving=inputMag>.06;

    let desiredSpeed=0;
    if(moving && lifeStage!=='Newborn'){
      // Young kittens are slower; speed and coordination improve with age.
      const youthMove=mix(.66,1.0,ageAdultness);
      const seniorMove=lifeStage==='Senior'?.78:1;
      const walkSpeed=1.75*youthMove*seniorMove;
      const runSpeed=4.35*youthMove*seniorMove;

      // Running drains stamina fastest when young. Walking always remains available.
      if(runHeld && !tired){
        stamina-=dt*mix(.22,.10,ageAdultness);
      }else{
        stamina+=dt*mix(.18,.26,ageAdultness);
      }
      stamina=Math.max(0,Math.min(1,stamina));
      if(stamina<=.03)tired=true;
      if(stamina>=.40)tired=false;

      desiredSpeed=((runHeld&&!tired)?runSpeed:walkSpeed)*inputMag;
    }else{
      stamina=Math.min(1,stamina+dt*.24);
    }

    const accel=moving?mix(4.3,6.8,ageAdultness):7.6;
    const speedStep=accel*dt;
    if(currentSpeed<desiredSpeed)currentSpeed=Math.min(desiredSpeed,currentSpeed+speedStep);
    else currentSpeed=Math.max(desiredSpeed,currentSpeed-speedStep);

    if(moving){
      const forward=-move.y;
      const right=-move.x;
      const desiredAngle=cameraYaw+Math.atan2(right,forward);

      // Smooth body rotation instead of snapping.
      cat.rotation.y+=angleDelta(cat.rotation.y,desiredAngle)*Math.min(1,9*dt);

      // Movement follows input direction immediately while body catches up visually.
      cat.position.x+=Math.sin(desiredAngle)*currentSpeed*dt;
      cat.position.z+=Math.cos(desiredAngle)*currentSpeed*dt;
    }

    cat.position.x=Math.max(-7.3,Math.min(7.3,cat.position.x));
    cat.position.z=Math.max(-7.3,Math.min(7.3,cat.position.z));

    // Jump / gravity. Very young cats have a softer, shorter arc.
    const gravity=mix(8.1,8.9,ageAdultness);
    vy-=gravity*dt;
    cat.position.y+=vy*dt;
    if(cat.position.y<=0){
      cat.position.y=0;
      vy=0;
      onGround=true;
    }

    // Procedural cat gait. Young kittens are bouncier and slightly clumsier.
    const adultRun=4.35;
    const gait=Math.min(1,currentSpeed/adultRun);
    const youth=1-ageAdultness;
    if(currentSpeed>.08 && onGround){
      movePhase+=dt*(runHeld?11.5:7.2)*(0.45+gait*.65);
      const swing=Math.sin(movePhase)*(runHeld?.50:.34)*gait;
      legs[0].rotation.x=swing;
      legs[3].rotation.x=swing;
      legs[1].rotation.x=-swing;
      legs[2].rotation.x=-swing;

      const kittenBounce=mix(.018,.042,youth);
      const bob=Math.abs(Math.sin(movePhase*2))*kittenBounce*gait;
      torso.position.y=.58+bob;
      head.position.y=(lifeStage==='Senior'?.855:.88)+bob*.65;

      // A subtle side-to-side wobble gives kittens a less perfectly controlled gait.
      catRig.rotation.z=Math.sin(movePhase*.5)*.045*youth*gait;
      catRig.rotation.x=Math.sin(movePhase)*.018*youth*gait;
    }else{
      for(const leg of legs)leg.rotation.x*=Math.max(0,1-9*dt);
      torso.position.y+=(.58-torso.position.y)*Math.min(1,8*dt);
      const restingHeadY=lifeStage==='Senior'?.855:.88;
      head.position.y+=(restingHeadY-head.position.y)*Math.min(1,8*dt);
      catRig.rotation.z*=Math.max(0,1-6*dt);
      catRig.rotation.x*=Math.max(0,1-6*dt);
    }

    // Tuck legs slightly in the air.
    if(!onGround){
      for(let i=0;i<legs.length;i++){
        const target=legs[i].userData.isFront?-.32:.34;
        legs[i].rotation.x+=(target-legs[i].rotation.x)*Math.min(1,8*dt);
      }
    }

    // Playful kitten idle: more tail activity, tiny head/ear fidgets and curiosity.
    const t=performance.now()*.001;
    idlePhase+=dt;
    const youthIdle=1-ageAdultness;
    tailRoot.rotation.y=
      Math.sin(t*(1.7+youthIdle*.8))*(.20+youthIdle*.11)+
      (moving?Math.sin(movePhase*.5)*.08:0);
    tailSegments.forEach((seg,i)=>{
      seg.rotation.y=Math.sin(t*(1.5+youthIdle*.4)-i*.32)*(.07+i*.01+youthIdle*.018);
      seg.rotation.x=-.03-i*.018;
    });

    const idleCuriosity=!moving&&onGround ? youthIdle : 0;
    head.rotation.y=Math.sin(t*.72)*.055*idleCuriosity;
    head.rotation.x=Math.sin(t*.91)*.025*idleCuriosity;
    head.rotation.z=Math.sin(movePhase)*.012*gait + Math.sin(t*.63)*.012*idleCuriosity;
    earL.rotation.z=-.05+Math.sin(t*2.3)*.025*idleCuriosity;
    earR.rotation.z=.05-Math.sin(t*2.0+.8)*.025*idleCuriosity;

    // Smoother cat-height camera; it lowers and moves closer for a small kitten.
    const targetHeight=mix(.40,.70,ageAdultness);
    const target=cat.position.clone().add(new THREE.Vector3(0,targetHeight,0));
    const dist=mix(2.45,3.15,ageAdultness);
    const cameraLift=mix(1.05,1.52,ageAdultness);
    const desiredCam=target.clone().add(
      new THREE.Vector3(
        Math.sin(cameraYaw)*-dist,
        cameraLift,
        Math.cos(cameraYaw)*-dist
      )
    );
    const camBlend=1-Math.pow(.001,dt);
    camera.position.lerp(desiredCam,camBlend);
    camera.lookAt(target);

    if(!onGround)status.textContent='Test Room • Jumping';
    else if(tired && runHeld)status.textContent='Test Room • Little legs are tired';
    else if(currentSpeed>2.5)status.textContent='Test Room • Running';
    else if(currentSpeed>.12)status.textContent='Test Room • Walking';
    else status.textContent='Test Room • '+lifeStage;

    renderer.render(scene,camera);
  }

  animate();

  addEventListener('resize',()=>resizeRenderer(true));
  addEventListener('orientationchange',()=>setTimeout(()=>resizeRenderer(true),150));

}catch(e){
  status.textContent='3D load failed';
  document.body.insertAdjacentHTML(
    'beforeend',
    '<div style="position:fixed;top:45%;left:10%;right:10%;padding:18px;background:#fff;color:#222;border-radius:14px;text-align:center">Could not load the 3D engine.<br><small>'+String(e.message).replaceAll('<','&lt;')+'</small></div>'
  );
}
</script>
</body>
</html>
