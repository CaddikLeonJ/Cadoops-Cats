<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cadoops' Cats</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#87b8d8;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none} body{position:fixed;inset:0}
canvas{display:block;position:absolute;left:0;top:0;width:100%!important;height:100%!important}
button,#hud,#stick,#knob,#hint,#brand,#ver,#status,#customiseBtn,#musicBtn,#customPanel,#customCard{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{appearance:none;-webkit-appearance:none}
#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 4px #0008}
#brand{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;font-weight:800;font-size:20px}
#ver{font-size:12px;opacity:.8;margin-top:2px}#age{font-size:12px;opacity:.9;margin-top:3px}
#status{position:absolute;top:max(14px,env(safe-area-inset-top));right:16px;font-size:13px}
#stick{pointer-events:auto;position:absolute;left:24px;bottom:max(28px,env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;background:#ffffff28;border:2px solid #ffffff55}
#knob{position:absolute;left:34px;top:34px;width:50px;height:50px;border-radius:50%;background:#ffffffaa}
.btn{pointer-events:auto;position:absolute;border:0;border-radius:50%;background:#ffffffaa;color:#222;font-weight:800;box-shadow:0 3px 10px #0004}
#jump{right:24px;bottom:max(32px,env(safe-area-inset-bottom));width:78px;height:78px}
#run{right:116px;bottom:max(42px,env(safe-area-inset-bottom));width:62px;height:62px}
#meow{right:24px;bottom:max(122px,calc(env(safe-area-inset-bottom) + 122px));width:70px;height:70px;font-size:12px}
#hint{position:absolute;bottom:max(198px,calc(env(safe-area-inset-bottom) + 198px));right:20px;font-size:12px;opacity:.85}
#customiseBtn{pointer-events:auto;position:absolute;left:16px;top:max(82px,calc(env(safe-area-inset-top) + 68px));border:0;border-radius:14px;padding:10px 14px;background:#ffffffd9;color:#222;font-weight:800;font-size:12px;box-shadow:0 3px 10px #0004;touch-action:manipulation}
#musicBtn{pointer-events:auto;position:absolute;left:16px;top:max(128px,calc(env(safe-area-inset-top) + 114px));border:0;border-radius:14px;padding:9px 12px;background:#ffffffc9;color:#222;font-weight:800;font-size:11px;box-shadow:0 3px 10px #0004;touch-action:manipulation}
#customPanel{display:none;position:fixed;inset:0;z-index:20;background:#0008;pointer-events:auto;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
#customPanel.open{display:flex}
#customCard{width:min(430px,92vw);max-height:84%;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:#f7f3ea;color:#242424;text-shadow:none;border-radius:20px;padding:16px 16px 18px;box-sizing:border-box;box-shadow:0 12px 40px #0008}
#customCard h2{margin:0 0 4px;font-size:22px}
#customCard .sub{margin:0 0 14px;font-size:12px;opacity:.68}
.customGroup{margin:13px 0}
.customLabel{font-size:13px;font-weight:800;margin-bottom:8px}
.choiceRow{display:flex;flex-wrap:wrap;gap:8px}
.choice{min-height:42px;border:2px solid #0002;border-radius:12px;background:white;color:#222;padding:8px 11px;font-weight:700;touch-action:manipulation}
.choice.selected{border-color:#222;box-shadow:0 0 0 1px #222 inset}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #0003;touch-action:manipulation}
.swatch.selected{box-shadow:0 0 0 3px #222}
#customDone{width:100%;min-height:48px;margin-top:14px;border:0;border-radius:14px;background:#222;color:#fff;font-size:16px;font-weight:900;touch-action:manipulation}
</style>
</head>
<body>
<div id="hud">
  <div id="brand">Cadoops' Cats<div id="ver">Prototype v0.1.3</div><div id="age">Kitten • 10 weeks</div></div>
  <div id="status">Loading 3D world…</div>
  <div id="stick"><div id="knob"></div></div>
  <button class="btn" id="jump">JUMP</button>
  <button class="btn" id="run">RUN</button>
  <button class="btn" id="meow">MEOW</button>
  <button id="customiseBtn">CUSTOMISE</button>
  <button id="musicBtn">MUSIC: ON</button>
  <div id="hint">Drag anywhere else to turn camera</div>
</div>

<div id="customPanel">
  <div id="customCard">
    <h2>Customise Cat</h2>
    <p class="sub">Changes update on your kitten instantly.</p>

    <div class="customGroup">
      <div class="customLabel">Coat colour</div>
      <div class="choiceRow" id="coatChoices">
        <button class="swatch selected" data-coat="black" aria-label="Black" title="Black" style="background:#202326"></button>
        <button class="swatch" data-coat="white" aria-label="White" title="White" style="background:#eeeeea"></button>
        <button class="swatch" data-coat="grey" aria-label="Grey" title="Grey" style="background:#777d82"></button>
        <button class="swatch" data-coat="brown" aria-label="Brown" title="Brown" style="background:#68483a"></button>
        <button class="swatch" data-coat="cream" aria-label="Cream" title="Cream" style="background:#d9c19a"></button>
        <button class="swatch" data-coat="ginger" aria-label="Ginger" title="Ginger" style="background:#c97938"></button>
        <button class="swatch" data-coat="red" aria-label="Red" title="Red" style="background:#c73f3f"></button>
        <button class="swatch" data-coat="orange" aria-label="Orange" title="Orange" style="background:#e88a2d"></button>
        <button class="swatch" data-coat="yellow" aria-label="Yellow" title="Yellow" style="background:#e4c83c"></button>
        <button class="swatch" data-coat="green" aria-label="Green" title="Green" style="background:#49a75d"></button>
        <button class="swatch" data-coat="blue" aria-label="Blue" title="Blue" style="background:#4d79c9"></button>
        <button class="swatch" data-coat="cyan" aria-label="Cyan" title="Cyan" style="background:#48b9c7"></button>
        <button class="swatch" data-coat="purple" aria-label="Purple" title="Purple" style="background:#8356ba"></button>
        <button class="swatch" data-coat="pink" aria-label="Pink" title="Pink" style="background:#df75a8"></button>
      </div>
    </div>

    <div class="customGroup">
      <div class="customLabel">Secondary / marking colour</div>
      <div class="choiceRow" id="secondaryChoices">
        <button class="swatch selected" data-secondary="white" aria-label="White markings" title="White" style="background:#f2f0e9"></button>
        <button class="swatch" data-secondary="black" aria-label="Black markings" title="Black" style="background:#202326"></button>
        <button class="swatch" data-secondary="grey" aria-label="Grey markings" title="Grey" style="background:#777d82"></button>
        <button class="swatch" data-secondary="brown" aria-label="Brown markings" title="Brown" style="background:#68483a"></button>
        <button class="swatch" data-secondary="cream" aria-label="Cream markings" title="Cream" style="background:#d9c19a"></button>
        <button class="swatch" data-secondary="ginger" aria-label="Ginger markings" title="Ginger" style="background:#c97938"></button>
        <button class="swatch" data-secondary="red" aria-label="Red markings" title="Red" style="background:#c73f3f"></button>
        <button class="swatch" data-secondary="orange" aria-label="Orange markings" title="Orange" style="background:#e88a2d"></button>
        <button class="swatch" data-secondary="yellow" aria-label="Yellow markings" title="Yellow" style="background:#e4c83c"></button>
        <button class="swatch" data-secondary="green" aria-label="Green markings" title="Green" style="background:#49a75d"></button>
        <button class="swatch" data-secondary="blue" aria-label="Blue markings" title="Blue" style="background:#4d79c9"></button>
        <button class="swatch" data-secondary="cyan" aria-label="Cyan markings" title="Cyan" style="background:#48b9c7"></button>
        <button class="swatch" data-secondary="purple" aria-label="Purple markings" title="Purple" style="background:#8356ba"></button>
        <button class="swatch" data-secondary="pink" aria-label="Pink markings" title="Pink" style="background:#df75a8"></button>
      </div>
    </div>

    <div class="customGroup">
      <div class="customLabel">Coat style</div>
      <div class="choiceRow" id="patternChoices">
        <button class="choice" data-pattern="solid">Solid</button>
        <button class="choice selected" data-pattern="tuxedo">Tuxedo</button>
        <button class="choice" data-pattern="mitted">Mitted</button>
        <button class="choice" data-pattern="bicolour">Bicolour</button>
        <button class="choice" data-pattern="van">Van-style</button>
        <button class="choice" data-pattern="mackerel">Mackerel Tabby</button>
        <button class="choice" data-pattern="classic">Classic Tabby</button>
        <button class="choice" data-pattern="point">Colourpoint</button>
        <button class="choice" data-pattern="tortie">Tortoiseshell</button>
        <button class="choice" data-pattern="calico">Calico</button>
      </div>
    </div>

    <div class="customGroup">
      <div class="customLabel">Eye colour</div>
      <div class="choiceRow" id="eyeChoices">
        <button class="swatch selected" data-eye="green" aria-label="Green eyes" style="background:#9fbf62"></button>
        <button class="swatch" data-eye="blue" aria-label="Blue eyes" style="background:#6faed9"></button>
        <button class="swatch" data-eye="amber" aria-label="Amber eyes" style="background:#d69a37"></button>
        <button class="swatch" data-eye="hazel" aria-label="Hazel eyes" style="background:#9a8748"></button>
      </div>
    </div>

    <div class="customGroup">
      <div class="customLabel">Nose colour</div>
      <div class="choiceRow" id="noseChoices">
        <button class="swatch selected" data-nose="pink" aria-label="Pink nose" style="background:#d68d89"></button>
        <button class="swatch" data-nose="black" aria-label="Black nose" style="background:#252525"></button>
        <button class="swatch" data-nose="brown" aria-label="Brown nose" style="background:#6c4637"></button>
      </div>
    </div>

    <button id="customDone">DONE</button>
  </div>
</div>

<script type="module">
const status=document.getElementById('status');
const ageLabel=document.getElementById('age');
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());

const musicBtn=document.getElementById('musicBtn');
const MUSIC_URL='https://raw.githubusercontent.com/CaddikLeonJ/Cadoops-Cats/main/Curious%20Whiskers.mp3';
const bgMusic=new Audio(MUSIC_URL);
bgMusic.loop=true;
bgMusic.preload='auto';
bgMusic.volume=.30;
bgMusic.setAttribute('playsinline','');
let musicEnabled=true;
let musicStarted=false;

async function startMusicFromGesture(){
  if(!musicEnabled || musicStarted)return;
  try{
    bgMusic.volume=.30;
    await bgMusic.play();
    musicStarted=true;
    musicBtn.textContent='MUSIC: ON';
  }catch(err){
    // iOS may still reject a non-user-initiated attempt; the next direct tap retries.
  }
}

function stopMusic(){
  bgMusic.pause();
  musicStarted=false;
}

musicBtn.addEventListener('pointerdown',async e=>{
  e.preventDefault();
  e.stopPropagation();
  musicEnabled=!musicEnabled;
  if(musicEnabled){
    musicBtn.textContent='MUSIC: ON';
    await startMusicFromGesture();
  }else{
    musicBtn.textContent='MUSIC: OFF';
    stopMusic();
  }
});

// iOS/WebView audio can only begin after a real user gesture.
// The first interaction anywhere in the game unlocks and starts the soundtrack.
document.addEventListener('pointerdown',()=>{
  if(musicEnabled)startMusicFromGesture();
},{capture:true});

try{
  const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');

  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x91bdd6);
  scene.fog=new THREE.Fog(0x91bdd6,18,45);

  const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.05,100);
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  document.body.prepend(renderer.domElement);

  let lastViewW=0,lastViewH=0;
  function resizeRenderer(force=false){
    const rect=renderer.domElement.getBoundingClientRect();
    const w=Math.max(1,Math.round(rect.width||document.body.clientWidth||innerWidth));
    const h=Math.max(1,Math.round(rect.height||document.body.clientHeight||innerHeight));
    if(!force && w===lastViewW && h===lastViewH)return;
    lastViewW=w; lastViewH=h;
    renderer.setSize(w,h,false);
    camera.aspect=w/h;
    camera.updateProjectionMatrix();
  }
  resizeRenderer(true);
  requestAnimationFrame(()=>resizeRenderer(true));
  setTimeout(()=>resizeRenderer(true),100);
  setTimeout(()=>resizeRenderer(true),500);
  setTimeout(()=>resizeRenderer(true),1200);

  scene.add(new THREE.HemisphereLight(0xfff4df,0x64745e,2.15));
  const sun=new THREE.DirectionalLight(0xffffff,2.25);
  sun.position.set(5,9,4);
  sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  scene.add(sun);

  const floor=new THREE.Mesh(
    new THREE.PlaneGeometry(24,24),
    new THREE.MeshStandardMaterial({color:0xcaa97c,roughness:.92})
  );
  floor.rotation.x=-Math.PI/2;
  floor.receiveShadow=true;
  scene.add(floor);

  const grid=new THREE.GridHelper(24,24,0x8f7659,0xb79a76);
  grid.position.y=.004;
  scene.add(grid);

  const wallMat=new THREE.MeshStandardMaterial({color:0xe8dfd0,roughness:.9});
  function box(x,y,z,w,h,d,mat=wallMat){
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    m.position.set(x,y,z);
    m.castShadow=m.receiveShadow=true;
    scene.add(m);
    return m;
  }

  box(0,1.5,-8,16,3,.25);
  box(-8,1.5,0,.25,3,16);
  box(8,1.5,0,.25,3,16);

  const sofaMat=new THREE.MeshStandardMaterial({color:0x667b70,roughness:.9});
  box(-3,.45,-3,3.5,.8,1.3,sofaMat);
  box(-3,1,-3.55,3.5,1.1,.25,sofaMat);

  // --- Cat model / life-stage rig ---
  const cat=new THREE.Group();
  cat.position.set(0,0,2);
  scene.add(cat);

  const catRig=new THREE.Group();
  cat.add(catRig);

  // Customisable materials.
  const coatMat=new THREE.MeshStandardMaterial({color:0x202326,roughness:.9});
  const markingMat=new THREE.MeshStandardMaterial({color:0xf2f0e9,roughness:.96});
  const noseMat=new THREE.MeshStandardMaterial({color:0xd68d89,roughness:.8});
  const innerEarMat=new THREE.MeshStandardMaterial({color:0xb86f73,roughness:.88});
  const eyeMat=new THREE.MeshStandardMaterial({color:0x9fbf62,roughness:.3,metalness:.03});
  const pupilMat=new THREE.MeshStandardMaterial({color:0x050505,roughness:.4});
  const stripeMat=new THREE.MeshStandardMaterial({color:0x111315,roughness:.92});
  const whiskerMat=new THREE.MeshStandardMaterial({color:0xe8e5dc,roughness:.8});

  function mesh(parent,geometry,material,pos,scale=[1,1,1],rot=[0,0,0]){
    const m=new THREE.Mesh(geometry,material);
    m.position.set(...pos);
    m.scale.set(...scale);
    m.rotation.set(...rot);
    m.castShadow=true;
    m.receiveShadow=true;
    parent.add(m);
    return m;
  }

  // Lower, longer feline body: shoulders, ribcage and rear haunches overlap
  // to make one continuous cat silhouette rather than a round blob.
  const torso=mesh(catRig,new THREE.SphereGeometry(.5,24,18),coatMat,[0,.53,-.04],[.58,.50,.98]);
  const shoulders=mesh(catRig,new THREE.SphereGeometry(.34,22,16),coatMat,[0,.56,.34],[.82,.82,.82]);
  const haunches=mesh(catRig,new THREE.SphereGeometry(.38,22,16),coatMat,[0,.56,-.36],[.88,.90,.92]);
  const neck=mesh(catRig,new THREE.SphereGeometry(.23,18,14),coatMat,[0,.68,.47],[.82,1.0,.72]);

  // Marking meshes can be switched between coat and the chosen secondary colour.
  const chest=mesh(catRig,new THREE.SphereGeometry(.22,18,13),markingMat,[0,.49,.41],[.65,1.10,.34]);

  const head=new THREE.Group();
  head.position.set(0,.79,.63);
  catRig.add(head);
  const headMesh=mesh(head,new THREE.SphereGeometry(.31,24,18),coatMat,[0,0,0],[1,.90,.84]);

  // Slight cheek width and compact muzzle make the face read as feline.
  const cheekL=mesh(head,new THREE.SphereGeometry(.13,16,12),coatMat,[-.13,-.055,.20],[1.1,.75,.62]);
  const cheekR=mesh(head,new THREE.SphereGeometry(.13,16,12),coatMat,[ .13,-.055,.20],[1.1,.75,.62]);
  const muzzleL=mesh(head,new THREE.SphereGeometry(.115,16,12),markingMat,[-.075,-.105,.255],[.90,.66,.58]);
  const muzzleR=mesh(head,new THREE.SphereGeometry(.115,16,12),markingMat,[ .075,-.105,.255],[.90,.66,.58]);
  const nose=mesh(head,new THREE.SphereGeometry(.052,14,10),noseMat,[0,-.075,.338],[1.10,.62,.72]);
  const mouthMat=new THREE.MeshStandardMaterial({color:0x351b1e,roughness:.9});
  const mouth=mesh(head,new THREE.SphereGeometry(.055,12,8),mouthMat,[0,-.145,.302],[.75,.16,.42]);
  let meowMouthUntil=0;

  const earL=mesh(head,new THREE.ConeGeometry(.14,.31,3),coatMat,[-.19,.255,-.005],[.92,1,.72],[0,0,-.08]);
  const earR=mesh(head,new THREE.ConeGeometry(.14,.31,3),coatMat,[ .19,.255,-.005],[.92,1,.72],[0,0,.08]);
  mesh(head,new THREE.ConeGeometry(.082,.205,3),innerEarMat,[-.19,.257,.018],[.88,1,.52],[0,0,-.08]);
  mesh(head,new THREE.ConeGeometry(.082,.205,3),innerEarMat,[ .19,.257,.018],[.88,1,.52],[0,0,.08]);

  const eyes=[];
  function addEye(x){
    const eye=new THREE.Group();
    eye.position.set(x,.035,.255);
    head.add(eye);
    mesh(eye,new THREE.SphereGeometry(.067,16,12),eyeMat,[0,0,0],[1.08,.78,.34]);
    mesh(eye,new THREE.SphereGeometry(.030,12,9),pupilMat,[0,0,.025],[.34,1.12,.28]);
    eyes.push(eye);
  }
  addEye(-.115);
  addEye(.115);

  // Small white blaze used by the bicolour preset.
  const blaze=mesh(head,new THREE.SphereGeometry(.09,14,10),markingMat,[0,.055,.272],[.52,1.55,.30]);
  blaze.visible=false;

  // Whiskers.
  const whiskers=[];
  for(const side of [-1,1]){
    for(let i=0;i<3;i++){
      const w=mesh(
        head,
        new THREE.CylinderGeometry(.004,.004,.29,6),
        whiskerMat,
        [side*.19,-.07-i*.025,.29],
        [1,1,1],
        [0,0,Math.PI/2 + side*(i-1)*.10]
      );
      w.castShadow=false;
      whiskers.push(w);
    }
  }

  // Two-piece legs: slim lower legs and broader upper joints look much more cat-like.
  const legs=[];
  const pawMeshes=[];
  function makeLeg(x,z,isFront){
    const leg=new THREE.Group();
    leg.position.set(x,.43,z);
    catRig.add(leg);

    const upper=mesh(
      leg,
      new THREE.CylinderGeometry(.075,.090,.20,10),
      coatMat,
      [0,-.08,isFront?.015:-.015],
      [1,1,1],
      [isFront?.10:-.12,0,0]
    );
    const lower=mesh(
      leg,
      new THREE.CylinderGeometry(.052,.065,.24,10),
      coatMat,
      [0,-.275,isFront?.025:-.025],
      [1,1,1],
      [isFront?-.08:.08,0,0]
    );
    const paw=mesh(
      leg,
      new THREE.SphereGeometry(.082,12,9),
      markingMat,
      [0,-.405,.055],
      [1.18,.50,1.48]
    );
    pawMeshes.push(paw);
    leg.userData={isFront,upper,lower,paw};
    legs.push(leg);
    return leg;
  }
  makeLeg(-.205,.31,true);
  makeLeg( .205,.31,true);
  makeLeg(-.225,-.33,false);
  makeLeg( .225,-.33,false);

  // Segmented curved tail.
  const tailRoot=new THREE.Group();
  tailRoot.position.set(0,.59,-.58);
  catRig.add(tailRoot);
  const tailSegments=[];
  const tailMeshes=[];
  let tailParent=tailRoot;
  for(let i=0;i<7;i++){
    const seg=new THREE.Group();
    seg.position.set(0,i===0?0:.035,i===0?0:-.18);
    tailParent.add(seg);
    const tm=mesh(
      seg,
      new THREE.CylinderGeometry(Math.max(.032,.055-i*.004),Math.max(.04,.069-i*.004),.23,10),
      coatMat,
      [0,.02,-.10],
      [1,1,1],
      [Math.PI/2,0,0]
    );
    tailMeshes.push(tm);
    tailSegments.push(seg);
    tailParent=seg;
  }
  tailRoot.rotation.x=1.02;

  // --- Coat-pattern overlay geometry ---
  // These sit just above the body surface so the patterns read as markings,
  // rather than simply recolouring whole body parts.
  const patternMeshes=[];
  function patternSphere(parent,pos,scale){
    const m=mesh(parent,new THREE.SphereGeometry(.13,14,10),markingMat,pos,scale);
    m.visible=false;
    patternMeshes.push(m);
    return m;
  }
  function patternStrip(parent,pos,scale,rot=[0,0,0]){
    const m=mesh(parent,new THREE.BoxGeometry(.035,.22,.13),markingMat,pos,scale,rot);
    m.visible=false;
    patternMeshes.push(m);
    return m;
  }

  // Side patches used by bicolour/tortie/calico.
  const sidePatches=[
    patternSphere(catRig,[ .285,.55,.06],[.28,.72,1.20]),
    patternSphere(catRig,[-.285,.56,-.18],[.30,.70,1.05]),
    patternSphere(catRig,[ .265,.57,-.39],[.26,.75,.90]),
    patternSphere(head,[ .205,.02,.18],[.42,.72,.62]),
    patternSphere(head,[-.19,.10,.15],[.34,.55,.55])
  ];

  // Van-style: colour concentrated on crown and tail while most of the coat is secondary.
  const vanPatches=[
    patternSphere(head,[-.13,.15,.12],[.52,.62,.55]),
    patternSphere(head,[ .15,.17,.10],[.48,.58,.52])
  ];

  // Mackerel tabby: narrow vertical/diagonal stripes on both flanks.
  const mackerelMarks=[];
  for(const side of [-1,1]){
    [-.27,-.10,.08,.24].forEach((z,i)=>{
      const s=patternStrip(
        catRig,
        [side*.292,.56,z],
        [1.0,1.05-(i*.08),.75],
        [0,0,side*(.10+(i%2)*.06)]
      );
      mackerelMarks.push(s);
    });
  }
  [-.07,0,.07].forEach((x,i)=>{

  // --- Age / growth ---
  // Slower prototype ageing: 1 real minute = 1 in-game day.
  // That means the starting 10-week kitten remains a kitten for nearly two hours
  // of active play before reaching adolescence.
  let ageWeeks=10;
  const AGE_WEEKS_PER_SECOND=1/420;

  const LIFE_STAGES={
    Newborn:{min:0,max:4},
    Kitten:{min:4,max:26},
    Adolescent:{min:26,max:52},
    Adult:{min:52,max:416},
    Senior:{min:416,max:Infinity}
  };

  function clamp01(v){return Math.max(0,Math.min(1,v))}
  function smooth01(v){
    v=clamp01(v);
    return v*v*(3-2*v);
  }
  function mix(a,b,t){return a+(b-a)*t}

  function stageForAge(w){
    if(w<4)return 'Newborn';
    if(w<26)return 'Kitten';
    if(w<52)return 'Adolescent';
    if(w<416)return 'Adult';
    return 'Senior';
  }

  function formatAge(w){
    if(w<52){
      const whole=Math.floor(w);
      const days=Math.floor((w-whole)*7);
      return whole+'w '+days+'d';
    }
    const years=w/52;
    return years<2?years.toFixed(1)+' years':Math.floor(years)+' years';
  }

  function updateGrowth(){
    lifeStage=stageForAge(ageWeeks);
    ageAdultness=smooth01(ageWeeks/52);

    let overall;
    if(ageWeeks<4)overall=mix(.28,.43,smooth01(ageWeeks/4));
    else if(ageWeeks<26)overall=mix(.43,.68,smooth01((ageWeeks-4)/22));
    else if(ageWeeks<52)overall=mix(.68,1.0,smooth01((ageWeeks-26)/26));
    else overall=1.0;

    visualScale=overall;
    catRig.scale.setScalar(overall);

    const youth=1-ageAdultness;

    // Kitten head stays proportionally larger while the body catches up.
    head.scale.setScalar(mix(1.0,1.24,youth));
    eyes.forEach(e=>e.scale.setScalar(mix(1.0,1.18,youth)));

    // Shorter muzzle, shorter legs and rounder body when young.
    const muzzleDepth=mix(1.0,.78,youth);
    muzzleL.scale.z=.58*muzzleDepth;
    muzzleR.scale.z=.58*muzzleDepth;
    cheekL.scale.z=.62*muzzleDepth;
    cheekR.scale.z=.62*muzzleDepth;
    nose.position.z=mix(.338,.315,youth);

    const legY=mix(1.0,.73,youth);
    legs.forEach(leg=>{
      leg.scale.y=legY;
      leg.position.y=mix(.43,.39,youth);
    });

    torso.scale.z=mix(.98,.92,youth);
    torso.scale.y=mix(.50,.56,youth);
    haunches.scale.z=mix(.92,.86,youth);
    shoulders.scale.z=mix(.82,.78,youth);

    const tailRel=mix(1.0,.80,youth);
    tailRoot.scale.setScalar(tailRel);

    if(lifeStage==='Senior'){
      catRig.position.y=-.025;
      head.position.y=.765;
    }else{
      catRig.position.y=0;
    }

    ageLabel.textContent=lifeStage+' • '+formatAge(ageWeeks);
  }

  // Build a tiny PCM WAV in memory once. The MEOW button then plays it as a
  // normal audio file, which is much more reliable in iOS/Scriptable than the old synth.
  function makeMeowWavURL(){
    const sampleRate=22050;
    const duration=.82;
    const count=Math.floor(sampleRate*duration);
    const buffer=new ArrayBuffer(44+count*2);
    const view=new DataView(buffer);

    function str(off,s){for(let i=0;i<s.length;i++)view.setUint8(off+i,s.charCodeAt(i))}
    str(0,'RIFF');
    view.setUint32(4,36+count*2,true);
    str(8,'WAVE');
    str(12,'fmt ');
    view.setUint32(16,16,true);
    view.setUint16(20,1,true);
    view.setUint16(22,1,true);
    view.setUint32(24,sampleRate,true);
    view.setUint32(28,sampleRate*2,true);
    view.setUint16(32,2,true);
    view.setUint16(34,16,true);
    str(36,'data');
    view.setUint32(40,count*2,true);

    let phase=0;
    let seed=2463534242;
    function noise(){
      seed^=seed<<13; seed^=seed>>>17; seed^=seed<<5;
      return ((seed>>>0)/4294967295)*2-1;
    }

    for(let i=0;i<count;i++){
      const t=i/sampleRate;
      let f;
      if(t<.16) f=470+(740-470)*(t/.16);
      else if(t<.40) f=740+42*Math.sin((t-.16)/.24*Math.PI);
      else f=740-(740-395)*((t-.40)/(duration-.40));

      // Gentle cat-like vibrato.
      f*=1+.018*Math.sin(Math.PI*2*6.2*t);
      phase+=Math.PI*2*f/sampleRate;

      let s=
        Math.sin(phase) +
        .42*Math.sin(phase*2+.18*Math.sin(Math.PI*2*3.2*t)) +
        .22*Math.sin(phase*3) +
        .11*Math.sin(phase*4) +
        .07*Math.sin(phase*5);

      // Small breathy attack.
      s+=noise()*.025*(1-Math.min(1,t/.22));

      const attack=Math.min(1,t/.035);
      const release=Math.min(1,(duration-t)/.22);
      const env=Math.sin(Math.min(1,attack)*Math.PI/2)*
                Math.sin(Math.min(1,release)*Math.PI/2)*
                (.72+.28*Math.sin(Math.PI*t/duration));

      s=Math.tanh(s*.8)*env*.82;
      view.setInt16(44+i*2,Math.max(-32767,Math.min(32767,Math.round(s*32767))),true);
    }

    return URL.createObjectURL(new Blob([buffer],{type:'audio/wav'}));
  }

  const meowURL=makeMeowWavURL();

  let fallbackAudioCtx=null;
  function fallbackMeow(){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!fallbackAudioCtx)fallbackAudioCtx=new AC();
    if(fallbackAudioCtx.state==='suspended')fallbackAudioCtx.resume();
    const now=fallbackAudioCtx.currentTime;
    const osc=fallbackAudioCtx.createOscillator();
    const gain=fallbackAudioCtx.createGain();
    osc.type='sawtooth';
    osc.frequency.setValueAtTime(520,now);
    osc.frequency.exponentialRampToValueAtTime(760,now+.13);
    osc.frequency.exponentialRampToValueAtTime(410,now+.55);
    gain.gain.setValueAtTime(.0001,now);
    gain.gain.exponentialRampToValueAtTime(.32,now+.025);
    gain.gain.exponentialRampToValueAtTime(.0001,now+.60);
    osc.connect(gain);
    gain.connect(fallbackAudioCtx.destination);
    osc.start(now);
    osc.stop(now+.62);
  }

  async function playMeow(){
    if(customOpen)return;
    meowMouthUntil=performance.now()+700;

    // Duck the soundtrack briefly so the cat voice stays clear.

      meowAudioElement.currentTime=0;
      meowAudioElement.volume=1;
      await meowAudioElement.play();
    }catch(err){

    setTimeout(()=>{

  function angleDelta(a,b){
    return Math.atan2(Math.sin(b-a),Math.cos(b-a));
  }

  const clock=new THREE.Clock();
  const camPos=new THREE.Vector3();
  status.textContent='Test Room • Cat ready';

  function animate(){
    requestAnimationFrame(animate);
    resizeRenderer();
    const dt=Math.min(clock.getDelta(),.033);

    if(!customOpen)ageWeeks+=AGE_WEEKS_PER_SECOND*dt;
    updateGrowth();

    const inputMag=Math.min(1,Math.hypot(move.x,move.y));
    const moving=!customOpen && inputMag>.06;

    let desiredSpeed=0;
    if(moving && lifeStage!=='Newborn'){
      // Young kittens are slower; speed and coordination improve with age.
      const youthMove=mix(.66,1.0,ageAdultness);
      const seniorMove=lifeStage==='Senior'?.78:1;
      const walkSpeed=1.75*youthMove*seniorMove;
      const runSpeed=4.35*youthMove*seniorMove;

      // Running drains stamina fastest when young. Walking always remains available.
      if(runHeld && !tired){
        stamina-=dt*mix(.22,.10,ageAdultness);
      }else{
        stamina+=dt*mix(.18,.26,ageAdultness);
      }
      stamina=Math.max(0,Math.min(1,stamina));
      if(stamina<=.03)tired=true;
      if(stamina>=.40)tired=false;

      desiredSpeed=((runHeld&&!tired)?runSpeed:walkSpeed)*inputMag;
    }else{
      stamina=Math.min(1,stamina+dt*.24);
    }

    const accel=moving?mix(4.3,6.8,ageAdultness):7.6;
    const speedStep=accel*dt;
    if(currentSpeed<desiredSpeed)currentSpeed=Math.min(desiredSpeed,currentSpeed+speedStep);
    else currentSpeed=Math.max(desiredSpeed,currentSpeed-speedStep);

    if(moving){
      const forward=-move.y;
      const right=-move.x;
      const desiredAngle=cameraYaw+Math.atan2(right,forward);

      // Smooth body rotation instead of snapping.
      cat.rotation.y+=angleDelta(cat.rotation.y,desiredAngle)*Math.min(1,9*dt);

      // Movement follows input direction immediately while body catches up visually.
      cat.position.x+=Math.sin(desiredAngle)*currentSpeed*dt;
      cat.position.z+=Math.cos(desiredAngle)*currentSpeed*dt;
    }

    cat.position.x=Math.max(-7.3,Math.min(7.3,cat.position.x));
    cat.position.z=Math.max(-7.3,Math.min(7.3,cat.position.z));

    // Jump / gravity. Very young cats have a softer, shorter arc.
    const gravity=mix(8.1,8.9,ageAdultness);
    vy-=gravity*dt;
    cat.position.y+=vy*dt;
    if(cat.position.y<=0){
      cat.position.y=0;
      vy=0;
      onGround=true;
    }

    // Four-beat feline walk, changing into a diagonal trot/run at speed.
    const adultRun=4.35;
    const gait=Math.min(1,currentSpeed/adultRun);
    const youth=1-ageAdultness;

    if(currentSpeed>.08 && onGround){
      const running=runHeld && !tired && currentSpeed>2.0;
      movePhase+=dt*(running?10.8:6.4)*(0.55+gait*.75);

      // Order: front-left, front-right, rear-left, rear-right.
      const walkPhases=[Math.PI*.5,Math.PI*1.5,0,Math.PI];
      const runPhases=[0,Math.PI,Math.PI,0];

      legs.forEach((leg,i)=>{
        const phase=movePhase+(running?runPhases[i]:walkPhases[i]);
        const stride=Math.sin(phase);
        const lift=Math.max(0,Math.sin(phase+Math.PI*.18));
        const amp=(running?.62:.38)*gait;

        // Whole leg swings from the shoulder/hip.
        leg.rotation.x=stride*amp;

        // Lower leg folds as the paw leaves the floor, then extends before contact.
        const lower=leg.userData.lower;
        const upper=leg.userData.upper;
        const paw=leg.userData.paw;
        upper.rotation.x+=(stride*(running?.16:.10)-upper.rotation.x)*Math.min(1,12*dt);
        lower.rotation.x+=((-lift*(running?.58:.42))-lower.rotation.x)*Math.min(1,14*dt);
        paw.rotation.x+=((lift*(running?.34:.24))-paw.rotation.x)*Math.min(1,16*dt);

        // A tiny paw lift stops the feet looking like rigid pendulums.
        paw.position.y=-.405+lift*(running?.055:.035);
      });

      // Cats flex through the spine. The shoulders and pelvis don't rise together:
      // one takes weight while the other follows.
      const bodyWave=Math.sin(movePhase*2);
      const shoulderWave=Math.sin(movePhase*2+.55);
      const haunchWave=Math.sin(movePhase*2-.55);
      const bounce=(running?.026:.014)*gait;

      shoulders.position.y=.56+shoulderWave*bounce;
      haunches.position.y=.56+haunchWave*bounce;
      torso.position.y=.53+bodyWave*bounce*.55;

      // Subtle compression/extension of the trunk during faster movement.
      const stretch=running?Math.sin(movePhase)*.045*gait:Math.sin(movePhase)*.015*gait;
      torso.scale.z+=( (.98+stretch)-torso.scale.z )*Math.min(1,10*dt);

      neck.rotation.x=Math.sin(movePhase*2+.3)*.025*gait;
      head.position.y=(lifeStage==='Senior'?.765:.79)+shoulderWave*bounce*.55;
      head.rotation.x=Math.sin(movePhase*2+.8)*.018*gait;

      // Hips and shoulders counter-rotate slightly, producing a feline body sway.
      catRig.rotation.z=Math.sin(movePhase)*.018*gait + Math.sin(movePhase*.5)*.020*youth*gait;
      torso.rotation.y=Math.sin(movePhase)*.035*gait;
      shoulders.rotation.y=-Math.sin(movePhase)*.045*gait;
      haunches.rotation.y=Math.sin(movePhase)*.055*gait;
    }else{
      for(const leg of legs){
        leg.rotation.x*=Math.max(0,1-10*dt);
        leg.userData.upper.rotation.x*=Math.max(0,1-10*dt);
        leg.userData.lower.rotation.x*=Math.max(0,1-12*dt);
        leg.userData.paw.rotation.x*=Math.max(0,1-12*dt);
        leg.userData.paw.position.y+=(-.405-leg.userData.paw.position.y)*Math.min(1,12*dt);
      }
      torso.position.y+=(.53-torso.position.y)*Math.min(1,8*dt);
      shoulders.position.y+=(.56-shoulders.position.y)*Math.min(1,8*dt);
      haunches.position.y+=(.56-haunches.position.y)*Math.min(1,8*dt);
      torso.rotation.y*=Math.max(0,1-7*dt);
      shoulders.rotation.y*=Math.max(0,1-7*dt);
      haunches.rotation.y*=Math.max(0,1-7*dt);
      neck.rotation.x*=Math.max(0,1-7*dt);
      const restingHeadY=lifeStage==='Senior'?.765:.79;
      head.position.y+=(restingHeadY-head.position.y)*Math.min(1,8*dt);
      catRig.rotation.z*=Math.max(0,1-6*dt);
      catRig.rotation.x*=Math.max(0,1-6*dt);
    }

    // Tuck legs slightly in the air.
    if(!onGround){
      for(let i=0;i<legs.length;i++){
        const target=legs[i].userData.isFront?-.28:.30;
        legs[i].rotation.x+=(target-legs[i].rotation.x)*Math.min(1,8*dt);
        legs[i].userData.lower.rotation.x+=(-.42-legs[i].userData.lower.rotation.x)*Math.min(1,8*dt);
        legs[i].userData.paw.rotation.x+=(.22-legs[i].userData.paw.rotation.x)*Math.min(1,8*dt);
      }
    }

    // Upright, expressive tail with a travelling sway from base to tip.
    const t=performance.now()*.001;
    idlePhase+=dt;
    const youthIdle=1-ageAdultness;

    const tailBaseTarget=1.02 + (moving?.12:.20);
    tailRoot.rotation.x+=(tailBaseTarget-tailRoot.rotation.x)*Math.min(1,6*dt);
    tailRoot.rotation.y=Math.sin(t*(1.25+youthIdle*.45))*(moving?.14:.24);

    tailSegments.forEach((seg,i)=>{
      const along=i/Math.max(1,tailSegments.length-1);
      seg.rotation.y=
        Math.sin(t*1.75-i*.55)*(0.06+along*.16) +
        (moving?Math.sin(movePhase*.45-i*.25)*.045:0);
      // The upper section curls gently back instead of pointing like a rigid pole.
      seg.rotation.x=-.055-(along*.065);
    });

    const idleCuriosity=!moving&&onGround ? youthIdle : 0;
    head.rotation.y=Math.sin(t*.72)*.055*idleCuriosity;
    if(currentSpeed<=.08)head.rotation.x=Math.sin(t*.91)*.025*idleCuriosity;
    head.rotation.z=Math.sin(movePhase)*.010*gait + Math.sin(t*.63)*.012*idleCuriosity;
    earL.rotation.z=-.08+Math.sin(t*2.3)*.025*idleCuriosity;
    earR.rotation.z=.08-Math.sin(t*2.0+.8)*.025*idleCuriosity;

    // Tiny visible mouth opening while the meow plays.
    const meowing=performance.now()<meowMouthUntil;
    mouth.scale.y+=( (meowing?.72:.16)-mouth.scale.y )*Math.min(1,18*dt);
    mouth.position.y+=( (meowing?-.157:-.145)-mouth.position.y )*Math.min(1,18*dt);

    // Cat-height camera. Customisation brings it closer for a live preview.
    const targetHeight=mix(.36,.64,ageAdultness);
    const target=cat.position.clone().add(new THREE.Vector3(0,targetHeight,0));
    const dist=customOpen?mix(1.55,1.95,ageAdultness):mix(2.35,3.05,ageAdultness);
    const cameraLift=customOpen?mix(.70,.95,ageAdultness):mix(.98,1.42,ageAdultness);
    const desiredCam=target.clone().add(
      new THREE.Vector3(
        Math.sin(cameraYaw)*-dist,
        cameraLift,
        Math.cos(cameraYaw)*-dist
      )
    );
    const camBlend=1-Math.pow(.001,dt);
    camera.position.lerp(desiredCam,camBlend);
    camera.lookAt(target);

    if(customOpen)status.textContent='Customising kitten';
    else if(performance.now()<meowMouthUntil)status.textContent='Test Room • Meow!';
    else if(!onGround)status.textContent='Test Room • Jumping';
    else if(tired && runHeld)status.textContent='Test Room • Little legs are tired';
    else if(currentSpeed>2.5)status.textContent='Test Room • Running';
    else if(currentSpeed>.12)status.textContent='Test Room • Walking';
    else status.textContent='Test Room • '+lifeStage;

    renderer.render(scene,camera);
  }

  animate();

  addEventListener('resize',()=>resizeRenderer(true));
  addEventListener('orientationchange',()=>setTimeout(()=>resizeRenderer(true),150));

}catch(e){
  status.textContent='3D load failed';
  document.body.insertAdjacentHTML(
    'beforeend',
    '<div style="position:fixed;top:45%;left:10%;right:10%;padding:18px;background:#fff;color:#222;border-radius:14px;text-align:center">Could not load the 3D engine.<br><small>'+String(e.message).replaceAll('<','&lt;')+'</small></div>'
  );
}
</script>
</body>
</html>
