<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cadoops' Cats</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#87b8d8;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none} body{position:fixed;inset:0}
canvas{display:block;position:absolute;left:0;top:0;width:100%!important;height:100%!important}
button,#hud,#stick,#knob,#hint,#brand,#ver,#status,#customiseBtn,#musicBtn,#settingsBtn,#customPanel,#customCard,#settingsPanel,#settingsCard{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{appearance:none;-webkit-appearance:none}
#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 4px #0008}
#brand{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;font-weight:800;font-size:20px}
#ver{font-size:12px;opacity:.8;margin-top:2px}#age{font-size:12px;opacity:.9;margin-top:3px}
#status{position:absolute;top:max(14px,env(safe-area-inset-top));right:16px;font-size:13px}
#stick{pointer-events:auto;position:absolute;left:24px;bottom:max(28px,env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;background:#ffffff28;border:2px solid #ffffff55}
#knob{position:absolute;left:34px;top:34px;width:50px;height:50px;border-radius:50%;background:#ffffffaa}
.btn{pointer-events:auto;position:absolute;border:0;border-radius:50%;background:#ffffffaa;color:#222;font-weight:800;box-shadow:0 3px 10px #0004}
#jump{right:24px;bottom:max(32px,env(safe-area-inset-bottom));width:78px;height:78px}
#run{right:116px;bottom:max(42px,env(safe-area-inset-bottom));width:62px;height:62px}
#meow{right:24px;bottom:max(122px,calc(env(safe-area-inset-bottom) + 122px));width:70px;height:70px;font-size:12px}
#purr{right:106px;bottom:max(126px,calc(env(safe-area-inset-bottom) + 126px));width:62px;height:62px;font-size:11px}
#hint{position:absolute;bottom:max(202px,calc(env(safe-area-inset-bottom) + 202px));right:20px;font-size:12px;opacity:.85}
#customiseBtn{pointer-events:auto;position:absolute;left:16px;top:max(82px,calc(env(safe-area-inset-top) + 68px));border:0;border-radius:14px;padding:10px 14px;background:#ffffffd9;color:#222;font-weight:800;font-size:12px;box-shadow:0 3px 10px #0004;touch-action:manipulation}
#musicBtn{pointer-events:auto;position:absolute;left:16px;top:max(128px,calc(env(safe-area-inset-top) + 114px));border:0;border-radius:14px;padding:9px 12px;background:#ffffffc9;color:#222;font-weight:800;font-size:11px;box-shadow:0 3px 10px #0004;touch-action:manipulation}
#settingsBtn{pointer-events:auto;position:absolute;left:16px;top:max(170px,calc(env(safe-area-inset-top) + 156px));border:0;border-radius:14px;padding:9px 12px;background:#ffffffc9;color:#222;font-weight:800;font-size:11px;box-shadow:0 3px 10px #0004;touch-action:manipulation}
#settingsPanel{display:none;position:fixed;inset:0;z-index:25;background:#0008;pointer-events:auto;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
#settingsPanel.open{display:flex}
#settingsCard{width:min(390px,92vw);background:#f7f3ea;color:#242424;text-shadow:none;border-radius:20px;padding:18px;box-sizing:border-box;box-shadow:0 12px 40px #0008}
#settingsCard h2{margin:0 0 16px;font-size:22px}
.settingRow{margin:10px 0 18px}
.settingTitle{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:14px;font-weight:800;margin-bottom:10px}
#musicVolume{width:100%;accent-color:#222;touch-action:pan-x}
#settingsDone{width:100%;min-height:48px;border:0;border-radius:14px;background:#222;color:#fff;font-size:16px;font-weight:900;touch-action:manipulation}
#customPanel{display:none;position:fixed;inset:0;z-index:20;background:#0008;pointer-events:auto;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
#customPanel.open{display:flex}
#customCard{width:min(430px,92vw);max-height:84%;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:#f7f3ea;color:#242424;text-shadow:none;border-radius:20px;padding:16px 16px 18px;box-sizing:border-box;box-shadow:0 12px 40px #0008}
#customCard h2{margin:0 0 4px;font-size:22px}
#customCard .sub{margin:0 0 14px;font-size:12px;opacity:.68}
.customGroup{margin:13px 0}
.customLabel{font-size:13px;font-weight:800;margin-bottom:8px}
.choiceRow{display:flex;flex-wrap:wrap;gap:8px}
.choice{min-height:42px;border:2px solid #0002;border-radius:12px;background:white;color:#222;padding:8px 11px;font-weight:700;touch-action:manipulation}
.choice.selected{border-color:#222;box-shadow:0 0 0 1px #222 inset}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #0003;touch-action:manipulation}
.swatch.selected{box-shadow:0 0 0 3px #222}
#customDone{width:100%;min-height:48px;margin-top:14px;border:0;border-radius:14px;background:#222;color:#fff;font-size:16px;font-weight:900;touch-action:manipulation}
</style>
</head>
<body>
<div id="hud">
  <div id="brand">Cadoops' Cats<div id="ver">Prototype v0.1.5</div><div id="age">Kitten • 10 weeks</div></div>
  <div id="status">Loading 3D world…</div>
  <div id="stick"><div id="knob"></div></div>
  <button class="btn" id="jump">JUMP</button>
  <button class="btn" id="run">RUN</button>
  <button class="btn" id="meow">MEOW</button>
  <button class="btn" id="purr">PURR</button>
  <button id="customiseBtn">CUSTOMISE</button>
  <button id="musicBtn">MUSIC: ON</button>
  <button id="settingsBtn">SETTINGS</button>
  <div id="hint">Drag anywhere else to turn camera</div>
</div>

<div id="settingsPanel">
  <div id="settingsCard">
    <h2>Settings</h2>
    <div class="settingRow">
      <div class="settingTitle">
        <span>Music Volume</span>
        <span id="musicVolumeValue">50 / 100</span>
      </div>
      <input id="musicVolume" type="range" min="0" max="100" value="50" step="1" aria-label="Music volume">
    </div>
    <button id="settingsDone">DONE</button>
  </div>
</div>

<div id="customPanel">
  <div id="customCard">
    <h2>Customise Cat</h2>
    <p class="sub">Changes update on your kitten instantly.</p>

    <div class="customGroup">
      <div class="customLabel">Coat colour</div>
      <div class="choiceRow" id="coatChoices">
        <button class="swatch selected" data-coat="black" aria-label="Black" title="Black" style="background:#202326"></button>
        <button class="swatch" data-coat="white" aria-label="White" title="White" style="background:#eeeeea"></button>
        <button class="swatch" data-coat="grey" aria-label="Grey" title="Grey" style="background:#777d82"></button>
        <button class="swatch" data-coat="brown" aria-label="Brown" title="Brown" style="background:#68483a"></button>
        <button class="swatch" data-coat="cream" aria-label="Cream" title="Cream" style="background:#d9c19a"></button>
        <button class="swatch" data-coat="ginger" aria-label="Ginger" title="Ginger" style="background:#c97938"></button>
        <button class="swatch" data-coat="red" aria-label="Red" title="Red" style="background:#c73f3f"></button>
        <button class="swatch" data-coat="orange" aria-label="Orange" title="Orange" style="background:#e88a2d"></button>
        <button class="swatch" data-coat="yellow" aria-label="Yellow" title="Yellow" style="background:#e4c83c"></button>
        <button class="swatch" data-coat="green" aria-label="Green" title="Green" style="background:#49a75d"></button>
        <button class="swatch" data-coat="blue" aria-label="Blue" title="Blue" style="background:#4d79c9"></button>
        <button class="swatch" data-coat="cyan" aria-label="Cyan" title="Cyan" style="background:#48b9c7"></button>
        <button class="swatch" data-coat="purple" aria-label="Purple" title="Purple" style="background:#8356ba"></button>
        <button class="swatch" data-coat="pink" aria-label="Pink" title="Pink" style="background:#df75a8"></button>
      </div>
    </div>

    <div class="customGroup">
      <div class="customLabel">Secondary / marking colour</div>
      <div class="choiceRow" id="secondaryChoices">
        <button class="swatch selected" data-secondary="white" aria-label="White markings" title="White" style="background:#f2f0e9"></button>
        <button class="swatch" data-secondary="black" aria-label="Black markings" title="Black" style="background:#202326"></button>
        <button class="swatch" data-secondary="grey" aria-label="Grey markings" title="Grey" style="background:#777d82"></button>
        <button class="swatch" data-secondary="brown" aria-label="Brown markings" title="Brown" style="background:#68483a"></button>
        <button class="swatch" data-secondary="cream" aria-label="Cream markings" title="Cream" style="background:#d9c19a"></button>
        <button class="swatch" data-secondary="ginger" aria-label="Ginger markings" title="Ginger" style="background:#c97938"></button>
        <button class="swatch" data-secondary="red" aria-label="Red markings" title="Red" style="background:#c73f3f"></button>
        <button class="swatch" data-secondary="orange" aria-label="Orange markings" title="Orange" style="background:#e88a2d"></button>
        <button class="swatch" data-secondary="yellow" aria-label="Yellow markings" title="Yellow" style="background:#e4c83c"></button>
        <button class="swatch" data-secondary="green" aria-label="Green markings" title="Green" style="background:#49a75d"></button>
        <button class="swatch" data-secondary="blue" aria-label="Blue markings" title="Blue" style="background:#4d79c9"></button>
        <button class="swatch" data-secondary="cyan" aria-label="Cyan markings" title="Cyan" style="background:#48b9c7"></button>
        <button class="swatch" data-secondary="purple" aria-label="Purple markings" title="Purple" style="background:#8356ba"></button>
        <button class="swatch" data-secondary="pink" aria-label="Pink markings" title="Pink" style="background:#df75a8"></button>
      </div>
    </div>

    <div class="customGroup">
      <div class="customLabel">Coat style</div>
      <div class="choiceRow" id="patternChoices">
        <button class="choice" data-pattern="solid">Solid</button>
        <button class="choice selected" data-pattern="tuxedo">Tuxedo</button>
        <button class="choice" data-pattern="mitted">Mitted</button>
        <button class="choice" data-pattern="bicolour">Bicolour</button>
        <button class="choice" data-pattern="van">Van-style</button>
        <button class="choice" data-pattern="mackerel">Mackerel Tabby</button>
        <button class="choice" data-pattern="classic">Classic Tabby</button>
        <button class="choice" data-pattern="point">Colourpoint</button>
        <button class="choice" data-pattern="tortie">Tortoiseshell</button>
        <button class="choice" data-pattern="calico">Calico</button>
      </div>
    </div>

    <div class="customGroup">
      <div class="customLabel">Eye colour</div>
      <div class="choiceRow" id="eyeChoices">
        <button class="swatch selected" data-eye="green" aria-label="Green eyes" style="background:#9fbf62"></button>
        <button class="swatch" data-eye="blue" aria-label="Blue eyes" style="background:#6faed9"></button>
        <button class="swatch" data-eye="amber" aria-label="Amber eyes" style="background:#d69a37"></button>
        <button class="swatch" data-eye="hazel" aria-label="Hazel eyes" style="background:#9a8748"></button>
      </div>
    </div>

    <div class="customGroup">
      <div class="customLabel">Nose colour</div>
      <div class="choiceRow" id="noseChoices">
        <button class="swatch selected" data-nose="pink" aria-label="Pink nose" style="background:#d68d89"></button>
        <button class="swatch" data-nose="black" aria-label="Black nose" style="background:#252525"></button>
        <button class="swatch" data-nose="brown" aria-label="Brown nose" style="background:#6c4637"></button>
      </div>
    </div>

    <button id="customDone">DONE</button>
  </div>
</div>

<script type="module">
const status=document.getElementById('status');
const ageLabel=document.getElementById('age');
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());

const musicBtn=document.getElementById('musicBtn');
const MUSIC_URL='https://raw.githubusercontent.com/CaddikLeonJ/Cadoops-Cats/main/Curious%20Whiskers.mp3';
const bgMusic=new Audio(MUSIC_URL);
bgMusic.loop=true;
bgMusic.preload='auto';
let musicVolume=.50;
bgMusic.volume=musicVolume;
bgMusic.setAttribute('playsinline','');
let musicEnabled=true;
let musicStarted=false;

async function startMusicFromGesture(){
  if(!musicEnabled || musicStarted)return;
  try{
    bgMusic.volume=musicVolume;
    await bgMusic.play();
    musicStarted=true;
    musicBtn.textContent='MUSIC: ON';
  }catch(err){
    // iOS may still reject a non-user-initiated attempt; the next direct tap retries.
  }
}

function stopMusic(){
  bgMusic.pause();
  musicStarted=false;
}

musicBtn.addEventListener('pointerdown',async e=>{
  e.preventDefault();
  e.stopPropagation();
  musicEnabled=!musicEnabled;
  if(musicEnabled){
    musicBtn.textContent='MUSIC: ON';
    bgMusic.volume=musicVolume;
    await startMusicFromGesture();
  }else{
    musicBtn.textContent='MUSIC: OFF';
    stopMusic();
  }
});

const settingsBtn=document.getElementById('settingsBtn');
const settingsPanel=document.getElementById('settingsPanel');
const settingsDone=document.getElementById('settingsDone');
const musicVolumeSlider=document.getElementById('musicVolume');
const musicVolumeValue=document.getElementById('musicVolumeValue');

function setMusicVolume(value){
  const n=Math.max(0,Math.min(100,Number(value)||0));
  musicVolume=n/100;
  bgMusic.volume=musicVolume;
  musicVolumeSlider.value=String(n);
  musicVolumeValue.textContent=Math.round(n)+' / 100';
}
setMusicVolume(50);

settingsBtn.addEventListener('pointerdown',e=>{
  e.preventDefault();
  e.stopPropagation();
  settingsPanel.classList.add('open');
});

settingsDone.addEventListener('pointerdown',e=>{
  e.preventDefault();
  e.stopPropagation();
  settingsPanel.classList.remove('open');
});

musicVolumeSlider.addEventListener('input',e=>{
  e.stopPropagation();
  setMusicVolume(e.target.value);
});

// iOS/WebView audio can only begin after a real user gesture.
// The first interaction anywhere in the game unlocks and starts the soundtrack.
document.addEventListener('pointerdown',()=>{
  if(musicEnabled)startMusicFromGesture();
},{capture:true});

try{
  const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');

  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x91bdd6);
  scene.fog=new THREE.Fog(0x91bdd6,18,45);

  const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.05,100);
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  document.body.prepend(renderer.domElement);

  let lastViewW=0,lastViewH=0;
  function resizeRenderer(force=false){
    const rect=renderer.domElement.getBoundingClientRect();
    const w=Math.max(1,Math.round(rect.width||document.body.clientWidth||innerWidth));
    const h=Math.max(1,Math.round(rect.height||document.body.clientHeight||innerHeight));
    if(!force && w===lastViewW && h===lastViewH)return;
    lastViewW=w; lastViewH=h;
    renderer.setSize(w,h,false);
    camera.aspect=w/h;
    camera.updateProjectionMatrix();
  }
  resizeRenderer(true);
  requestAnimationFrame(()=>resizeRenderer(true));
  setTimeout(()=>resizeRenderer(true),100);
  setTimeout(()=>resizeRenderer(true),500);
  setTimeout(()=>resizeRenderer(true),1200);

  scene.add(new THREE.HemisphereLight(0xfff4df,0x64745e,2.15));
  const sun=new THREE.DirectionalLight(0xffffff,2.25);
  sun.position.set(5,9,4);
  sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  scene.add(sun);

  const floor=new THREE.Mesh(
    new THREE.PlaneGeometry(24,24),
    new THREE.MeshStandardMaterial({color:0xcaa97c,roughness:.92})
  );
  floor.rotation.x=-Math.PI/2;
  floor.receiveShadow=true;
  scene.add(floor);

  const grid=new THREE.GridHelper(24,24,0x8f7659,0xb79a76);
  grid.position.y=.004;
  scene.add(grid);

  const wallMat=new THREE.MeshStandardMaterial({color:0xe8dfd0,roughness:.9});
  function box(x,y,z,w,h,d,mat=wallMat){
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    m.position.set(x,y,z);
    m.castShadow=m.receiveShadow=true;
    scene.add(m);
    return m;
  }

  box(0,1.5,-8,16,3,.25);
  box(-8,1.5,0,.25,3,16);
  box(8,1.5,0,.25,3,16);

  const sofaMat=new THREE.MeshStandardMaterial({color:0x667b70,roughness:.9});
  box(-3,.45,-3,3.5,.8,1.3,sofaMat);
  box(-3,1,-3.55,3.5,1.1,.25,sofaMat);

  // --- Cat model / life-stage rig ---
  const cat=new THREE.Group();
  cat.position.set(0,0,2);
  scene.add(cat);

  const catRig=new THREE.Group();
  cat.add(catRig);

  // Customisable materials.
  const coatMat=new THREE.MeshStandardMaterial({color:0x202326,roughness:.9});
  const markingMat=new THREE.MeshStandardMaterial({color:0xf2f0e9,roughness:.96});
  const noseMat=new THREE.MeshStandardMaterial({color:0xd68d89,roughness:.8});
  const innerEarMat=new THREE.MeshStandardMaterial({color:0xb86f73,roughness:.88});
  const eyeMat=new THREE.MeshStandardMaterial({color:0x9fbf62,roughness:.3,metalness:.03});
  const pupilMat=new THREE.MeshStandardMaterial({color:0x050505,roughness:.4});
  const stripeMat=new THREE.MeshStandardMaterial({color:0x111315,roughness:.92});
  const whiskerMat=new THREE.MeshStandardMaterial({color:0xe8e5dc,roughness:.8});

  function mesh(parent,geometry,material,pos,scale=[1,1,1],rot=[0,0,0]){
    const m=new THREE.Mesh(geometry,material);
    m.position.set(...pos);
    m.scale.set(...scale);
    m.rotation.set(...rot);
    m.castShadow=true;
    m.receiveShadow=true;
    parent.add(m);
    return m;
  }

  // Lower, longer feline body: shoulders, ribcage and rear haunches overlap
  // to make one continuous cat silhouette rather than a round blob.
  const torso=mesh(catRig,new THREE.SphereGeometry(.5,24,18),coatMat,[0,.53,-.04],[.58,.50,.98]);
  const shoulders=mesh(catRig,new THREE.SphereGeometry(.34,22,16),coatMat,[0,.56,.34],[.82,.82,.82]);
  const haunches=mesh(catRig,new THREE.SphereGeometry(.35,22,16),coatMat,[0,.55,-.32],[.76,.80,.80]);
  const neck=mesh(catRig,new THREE.SphereGeometry(.23,18,14),coatMat,[0,.68,.47],[.82,1.0,.72]);

  // Marking meshes can be switched between coat and the chosen secondary colour.
  const chest=mesh(catRig,new THREE.SphereGeometry(.22,18,13),markingMat,[0,.49,.41],[.65,1.10,.34]);

  const head=new THREE.Group();
  head.position.set(0,.79,.63);
  catRig.add(head);
  const headMesh=mesh(head,new THREE.SphereGeometry(.31,24,18),coatMat,[0,0,0],[1,.90,.84]);

  // Slight cheek width and compact muzzle make the face read as feline.
  const cheekL=mesh(head,new THREE.SphereGeometry(.13,16,12),coatMat,[-.13,-.055,.20],[1.1,.75,.62]);
  const cheekR=mesh(head,new THREE.SphereGeometry(.13,16,12),coatMat,[ .13,-.055,.20],[1.1,.75,.62]);
  const muzzleL=mesh(head,new THREE.SphereGeometry(.115,16,12),markingMat,[-.075,-.105,.255],[.90,.66,.58]);
  const muzzleR=mesh(head,new THREE.SphereGeometry(.115,16,12),markingMat,[ .075,-.105,.255],[.90,.66,.58]);
  const nose=mesh(head,new THREE.SphereGeometry(.052,14,10),noseMat,[0,-.075,.338],[1.10,.62,.72]);
  const mouthMat=new THREE.MeshStandardMaterial({color:0x351b1e,roughness:.9});
  const mouth=mesh(head,new THREE.SphereGeometry(.055,12,8),mouthMat,[0,-.145,.302],[.75,.16,.42]);
  const tongueMat=new THREE.MeshStandardMaterial({color:0xe89b9d,roughness:.82});
  const tongue=mesh(head,new THREE.SphereGeometry(.040,12,8),tongueMat,[0,-.168,.325],[.62,.18,.82]);
  tongue.visible=false;
  let meowMouthUntil=0;

  const earL=mesh(head,new THREE.ConeGeometry(.14,.31,3),coatMat,[-.19,.255,-.005],[.92,1,.72],[0,0,-.08]);
  const earR=mesh(head,new THREE.ConeGeometry(.14,.31,3),coatMat,[ .19,.255,-.005],[.92,1,.72],[0,0,.08]);
  mesh(head,new THREE.ConeGeometry(.082,.205,3),innerEarMat,[-.19,.257,.018],[.88,1,.52],[0,0,-.08]);
  mesh(head,new THREE.ConeGeometry(.082,.205,3),innerEarMat,[ .19,.257,.018],[.88,1,.52],[0,0,.08]);

  const eyes=[];
  function addEye(x){
    const eye=new THREE.Group();
    eye.position.set(x,.035,.255);
    head.add(eye);
    mesh(eye,new THREE.SphereGeometry(.067,16,12),eyeMat,[0,0,0],[1.08,.78,.34]);
    mesh(eye,new THREE.SphereGeometry(.030,12,9),pupilMat,[0,0,.025],[.34,1.12,.28]);
    eyes.push(eye);
  }
  addEye(-.115);
  addEye(.115);

  // Small white blaze used by the bicolour preset.
  const blaze=mesh(head,new THREE.SphereGeometry(.09,14,10),markingMat,[0,.055,.272],[.52,1.55,.30]);
  blaze.visible=false;

  // Whiskers.
  const whiskers=[];
  for(const side of [-1,1]){
    for(let i=0;i<3;i++){
      const w=mesh(
        head,
        new THREE.CylinderGeometry(.004,.004,.29,6),
        whiskerMat,
        [side*.19,-.07-i*.025,.29],
        [1,1,1],
        [0,0,Math.PI/2 + side*(i-1)*.10]
      );
      w.castShadow=false;
      whiskers.push(w);
    }
  }

  // Two-piece legs: slim lower legs and broader upper joints look much more cat-like.
  const legs=[];
  const pawMeshes=[];
  function makeLeg(x,z,isFront){
    const leg=new THREE.Group();
    leg.position.set(x,.43,z);
    catRig.add(leg);

    const upper=mesh(
      leg,
      new THREE.CylinderGeometry(.075,.090,.20,10),
      coatMat,
      [0,-.08,isFront?.015:-.015],
      [1,1,1],
      [isFront?.10:-.12,0,0]
    );
    const lower=mesh(
      leg,
      new THREE.CylinderGeometry(.052,.065,.24,10),
      coatMat,
      [0,-.275,isFront?.025:-.025],
      [1,1,1],
      [isFront?-.08:.08,0,0]
    );
    const paw=mesh(
      leg,
      new THREE.SphereGeometry(.082,12,9),
      markingMat,
      [0,-.405,.055],
      [1.18,.50,1.48]
    );
    pawMeshes.push(paw);
    leg.userData={isFront,upper,lower,paw};
    legs.push(leg);
    return leg;
  }
  makeLeg(-.205,.31,true);
  makeLeg( .205,.31,true);
  makeLeg(-.225,-.33,false);
  makeLeg( .225,-.33,false);

  // Segmented curved tail.
  const tailRoot=new THREE.Group();
  tailRoot.position.set(0,.59,-.58);
  catRig.add(tailRoot);
  const tailSegments=[];
  const tailMeshes=[];
  let tailParent=tailRoot;
  for(let i=0;i<7;i++){
    const seg=new THREE.Group();
    seg.position.set(0,i===0?0:.035,i===0?0:-.18);
    tailParent.add(seg);
    const tm=mesh(
      seg,
      new THREE.CylinderGeometry(Math.max(.032,.055-i*.004),Math.max(.04,.069-i*.004),.23,10),
      coatMat,
      [0,.02,-.10],
      [1,1,1],
      [Math.PI/2,0,0]
    );
    tailMeshes.push(tm);
    tailSegments.push(seg);
    tailParent=seg;
  }
  tailRoot.rotation.x=1.02;

  // --- Coat-pattern overlay geometry ---
  // These sit just above the body surface so the patterns read as markings,
  // rather than simply recolouring whole body parts.
  const patternMeshes=[];
  function patternSphere(parent,pos,scale){
    const m=mesh(parent,new THREE.SphereGeometry(.13,14,10),markingMat,pos,scale);
    m.visible=false;
    patternMeshes.push(m);
    return m;
  }
  function patternStrip(parent,pos,scale,rot=[0,0,0]){
    const m=mesh(parent,new THREE.BoxGeometry(.035,.22,.13),markingMat,pos,scale,rot);
    m.visible=false;
    patternMeshes.push(m);
    return m;
  }

  // Side patches used by bicolour/tortie/calico.
  const sidePatches=[
    patternSphere(catRig,[ .285,.55,.06],[.28,.72,1.20]),
    patternSphere(catRig,[-.285,.56,-.18],[.30,.70,1.05]),
    patternSphere(catRig,[ .265,.57,-.39],[.26,.75,.90]),
    patternSphere(head,[ .205,.02,.18],[.42,.72,.62]),
    patternSphere(head,[-.19,.10,.15],[.34,.55,.55])
  ];

  // Van-style: colour concentrated on crown and tail while most of the coat is secondary.
  const vanPatches=[
    patternSphere(head,[-.13,.15,.12],[.52,.62,.55]),
    patternSphere(head,[ .15,.17,.10],[.48,.58,.52])
  ];

  // Mackerel tabby: narrow vertical/diagonal stripes on both flanks.
  const mackerelMarks=[];
  for(const side of [-1,1]){
    [-.27,-.10,.08,.24].forEach((z,i)=>{
      const s=patternStrip(
        catRig,
        [side*.292,.56,z],
        [1.0,1.05-(i*.08),.75],
        [0,0,side*(.10+(i%2)*.06)]
      );
      mackerelMarks.push(s);
    });
  }
  [-.07,0,.07].forEach((x,i)=>{
    const s=patternStrip(head,[x,.13,.265],[.65,.55,.38],[0,0,(i-1)*.10]);
    mackerelMarks.push(s);
  });

  // Classic tabby: broad curved side swirls plus forehead lines.
  const classicMarks=[];
  for(const side of [-1,1]){
    const swirl=new THREE.Mesh(
      new THREE.TorusGeometry(.16,.025,8,28,Math.PI*1.55),
      markingMat
    );
    swirl.position.set(side*.302,.55,-.10);
    swirl.rotation.set(0,Math.PI/2,side*.35);
    swirl.scale.set(1.0,1.25,1.0);
    swirl.castShadow=true;
    swirl.visible=false;
    catRig.add(swirl);
    patternMeshes.push(swirl);
    classicMarks.push(swirl);

    classicMarks.push(shoulderStripe);
  }
  [-.07,0,.07].forEach((x,i)=>{
    const s=patternStrip(head,[x,.13,.265],[.70,.58,.40],[0,0,(i-1)*.12]);
    classicMarks.push(s);

  // Irregular patches for tortoiseshell/calico.

    patternSphere(catRig,[-.25,.58,-.43],[.24,.50,.68]),
    patternSphere(head,[ .18,.02,.19],[.34,.62,.54]),
    patternSphere(head,[-.16,.13,.14],[.30,.45,.48])
  ];

  // Fixed white for calico, with primary + chosen secondary patches over it.
  const calicoWhiteMat=new THREE.MeshStandardMaterial({color:0xf3f1eb,roughness:.96});
  const calicoWhite=[
    mesh(catRig,new THREE.SphereGeometry(.15,14,10),calicoWhiteMat,[-.29,.53,.24],[.28,.60,.80]),

  const vanPrimaryPatches=[
    mesh(head,new THREE.SphereGeometry(.13,14,10),vanPrimaryMat,[-.13,.14,.11],[.55,.66,.58]),

  // --- Cat appearance customisation ---
  const coatColours={
    black:0x202326,

    grey:0x777d82,
    brown:0x68483a,
    cream:0xd9c19a,

    orange:0xe88a2d,
    yellow:0xe4c83c,

    green:0x9fbf62,
    blue:0x6faed9,

  const noseColours={

    coat:'black',

  function applyAppearance(){
    const base=coatColours[catAppearance.coat];

    coatMat.color.setHex(base);
    markingMat.color.setHex(secondary);
    stripeMat.color.setHex(secondary);
    vanPrimaryMat.color.setHex(base);

    noseMat.color.setHex(noseColours[catAppearance.nose]);

    // Reset every optional pattern layer/material.
    patternMeshes.forEach(m=>m.visible=false);
    calicoWhite.forEach(m=>m.visible=false);
    vanPrimaryPatches.forEach(m=>m.visible=false);
    blaze.visible=false;

    // Reset the main anatomy to primary coat.
    [torso,shoulders,haunches,neck,headMesh,cheekL,cheekR,earL,earR].forEach(m=>m.material=coatMat);
    legs.forEach(leg=>{
      leg.userData.upper.material=coatMat;
      leg.userData.lower.material=coatMat;
    });
    tailMeshes.forEach(m=>m.material=coatMat);
    muzzleL.material=coatMat;
    muzzleR.material=coatMat;
    chest.material=coatMat;
    pawMeshes.forEach(p=>p.material=coatMat);

    if(pattern==='tuxedo'){
      muzzleL.material=markingMat;
      muzzleR.material=markingMat;
      chest.material=markingMat;
      pawMeshes.forEach(p=>p.material=markingMat);
      blaze.visible=true;
    }

    if(pattern==='mitted'){
      chest.material=markingMat;
      pawMeshes.forEach(p=>p.material=markingMat);
      muzzleL.material=markingMat;
      muzzleR.material=markingMat;
    }

    if(pattern==='bicolour'){
      muzzleL.material=markingMat;
      muzzleR.material=markingMat;
      chest.material=markingMat;
      pawMeshes.forEach(p=>p.material=markingMat);
      blaze.visible=true;
      sidePatches.forEach(m=>m.visible=true);
    }

    if(pattern==='van'){
      // Mostly secondary/white-like body with primary colour on crown and tail.
      [torso,shoulders,haunches,neck,headMesh,cheekL,cheekR].forEach(m=>m.material=markingMat);
      legs.forEach(leg=>{
        leg.userData.upper.material=markingMat;
        leg.userData.lower.material=markingMat;
      });
      pawMeshes.forEach(p=>p.material=markingMat);
      chest.material=markingMat;
      muzzleL.material=markingMat;
      muzzleR.material=markingMat;
      earL.material=coatMat;
      earR.material=coatMat;
      tailMeshes.forEach(m=>m.material=coatMat);
      vanPrimaryPatches.forEach(m=>m.visible=true);
    }

    if(pattern==='mackerel'){
      mackerelMarks.forEach(m=>m.visible=true);
      tailMeshes.forEach((m,i)=>{ if(i%2===1) m.material=markingMat; });
    }

    if(pattern==='classic'){
      classicMarks.forEach(m=>m.visible=true);
      tailMeshes.forEach((m,i)=>{ if(i===2||i===5) m.material=markingMat; });
    }

    if(pattern==='point'){
      // Siamese-style placement: darker/secondary extremities.
      earL.material=markingMat;
      earR.material=markingMat;
      cheekL.material=markingMat;
      cheekR.material=markingMat;
      muzzleL.material=markingMat;
      muzzleR.material=markingMat;
      pawMeshes.forEach(p=>p.material=markingMat);
      tailMeshes.forEach(m=>m.material=markingMat);
      blaze.visible=false;
    }

    if(pattern==='tortie'){
      tortiePatches.forEach(m=>m.visible=true);
    }

    if(pattern==='calico'){
      // White remains part of the traditional three-colour calico layout.
      calicoWhite.forEach(m=>m.visible=true);
      sidePatches.forEach((m,i)=>{m.visible=i%2===0});
      tortiePatches.forEach((m,i)=>{m.visible=i%2===1});
      chest.material=calicoWhiteMat;
      muzzleL.material=calicoWhiteMat;
      muzzleR.material=calicoWhiteMat;
      pawMeshes.forEach(p=>p.material=calicoWhiteMat);
    }
  }
  applyAppearance();

  // --- Age / growth ---
  // Slower prototype ageing: 1 real minute = 1 in-game day.
  // That means the starting 10-week kitten remains a kitten for nearly two hours
  // of active play before reaching adolescence.
  let ageWeeks=10;
  const AGE_WEEKS_PER_SECOND=1/420;
  let lifeStage='Kitten';
  let ageAdultness=0;
  let visualScale=.54;
  let stamina=1;
  let tired=false;

  const LIFE_STAGES={
    Newborn:{min:0,max:4},
    Kitten:{min:4,max:26},
    Adolescent:{min:26,max:52},
    Adult:{min:52,max:416},
    Senior:{min:416,max:Infinity}
  };

  function clamp01(v){return Math.max(0,Math.min(1,v))}
  function smooth01(v){
    v=clamp01(v);
    return v*v*(3-2*v);
  }
  function mix(a,b,t){return a+(b-a)*t}

  function stageForAge(w){
    if(w<4)return 'Newborn';
    if(w<26)return 'Kitten';
    if(w<52)return 'Adolescent';
    if(w<416)return 'Adult';
    return 'Senior';
  }

  function formatAge(w){
    if(w<52){
      const whole=Math.floor(w);
      const days=Math.floor((w-whole)*7);
      return whole+'w '+days+'d';
    }
    const years=w/52;
    return years<2?years.toFixed(1)+' years':Math.floor(years)+' years';
  }

  function updateGrowth(){
    lifeStage=stageForAge(ageWeeks);
    ageAdultness=smooth01(ageWeeks/52);

    let overall;
    if(ageWeeks<4)overall=mix(.28,.43,smooth01(ageWeeks/4));
    else if(ageWeeks<26)overall=mix(.43,.68,smooth01((ageWeeks-4)/22));
    else if(ageWeeks<52)overall=mix(.68,1.0,smooth01((ageWeeks-26)/26));
    else overall=1.0;

    visualScale=overall;
    catRig.scale.setScalar(overall);

    const youth=1-ageAdultness;

    // Kitten head stays proportionally larger while the body catches up.
    head.scale.setScalar(mix(1.0,1.24,youth));
    eyes.forEach(e=>e.scale.setScalar(mix(1.0,1.18,youth)));

    // Shorter muzzle, shorter legs and rounder body when young.
    const muzzleDepth=mix(1.0,.78,youth);
    muzzleL.scale.z=.58*muzzleDepth;
    muzzleR.scale.z=.58*muzzleDepth;
    cheekL.scale.z=.62*muzzleDepth;
    cheekR.scale.z=.62*muzzleDepth;
    nose.position.z=mix(.338,.315,youth);

    const legY=mix(1.0,.73,youth);
    legs.forEach(leg=>{
      leg.scale.y=legY;
      leg.position.y=mix(.43,.39,youth);
    });

    torso.scale.z=mix(.98,.92,youth);
    torso.scale.y=mix(.50,.56,youth);
    haunches.scale.x=mix(.76,.72,youth);
    haunches.scale.y=mix(.80,.76,youth);
    haunches.scale.z=mix(.80,.75,youth);
    shoulders.scale.z=mix(.82,.78,youth);

    const tailRel=mix(1.0,.80,youth);
    tailRoot.scale.setScalar(tailRel);

    if(lifeStage==='Senior'){
      catRig.position.y=-.025;
      head.position.y=.765;
    }else{
      catRig.position.y=0;
    }

    ageLabel.textContent=lifeStage+' • '+formatAge(ageWeeks);
  }
  updateGrowth();

  // --- Controls ---
  let cameraYaw=0;
  let vy=0;
  let onGround=true;
  let runHeld=false;
  let currentSpeed=0;
  let movePhase=0;
  const move={x:0,y:0};
  let idlePhase=0;
  let idleSeconds=0;
  let grooming=null;
  let groomingTime=0;
  let groomingDuration=0;
  let groomingSide=1;
  let nextGroomDelay=5;
  let purrUntil=0;
  let customOpen=false;
  let settingsOpen=false;
  let savedCameraYaw=0;

  const customPanel=document.getElementById('customPanel');
  const customiseBtn=document.getElementById('customiseBtn');
  const customDone=document.getElementById('customDone');

    settingsOpen=true;

  function stopGrooming(){

  function markSelected(groupSelector,dataName,value){

  function openCustomiser(){

    e.preventDefault();
    catAppearance.coat=btn.dataset.coat;
    markSelected('#coatChoices','coat',catAppearance.coat);
    applyAppearance();
  }));
  document.querySelectorAll('[data-secondary]').forEach(btn=>btn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    catAppearance.secondary=btn.dataset.secondary;
    markSelected('#secondaryChoices','secondary',catAppearance.secondary);
    applyAppearance();
  }));
  document.querySelectorAll('[data-pattern]').forEach(btn=>btn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    catAppearance.pattern=btn.dataset.pattern;
    markSelected('#patternChoices','pattern',catAppearance.pattern);
    applyAppearance();
  }));
  document.querySelectorAll('[data-eye]').forEach(btn=>btn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    catAppearance.eyes=btn.dataset.eye;
    markSelected('#eyeChoices','eye',catAppearance.eyes);
    applyAppearance();
  }));
  document.querySelectorAll('[data-nose]').forEach(btn=>btn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    catAppearance.nose=btn.dataset.nose;
    markSelected('#noseChoices','nose',catAppearance.nose);
    applyAppearance();
  }));

  const stick=document.getElementById('stick');
  const knob=document.getElementById('knob');
  let sid=null;

  function stickMove(e){
    if(customOpen||settingsOpen)return;
    markActive();
    const r=stick.getBoundingClientRect();
    const dx=e.clientX-(r.left+r.width/2);
    const dy=e.clientY-(r.top+r.height/2);
    const len=Math.hypot(dx,dy)||1;
    const max=42;
    const k=Math.min(1,max/len);
    knob.style.transform=`translate(${dx*k}px,${dy*k}px)`;
    move.x=dx/Math.max(max,len);
    move.y=dy/Math.max(max,len);
  }

  stick.addEventListener('pointerdown',e=>{
    e.preventDefault();
    sid=e.pointerId;
    stick.setPointerCapture(sid);
    stickMove(e);
  });

  const runBtn=document.getElementById('run');

  // --- Immediate cat voice SFX ---
  // Pre-build audio buffers. Each MEOW press creates a new BufferSource, so
  // repeated meows overlap instead of cutting off the sound already playing.
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  const sfxCtx=AudioCtx?new AudioCtx():null;

  function makeBuffer(duration,fillSample){
    if(!sfxCtx)return null;
    const rate=sfxCtx.sampleRate||44100;
    const buffer=sfxCtx.createBuffer(1,Math.floor(rate*duration),rate);
    const data=buffer.getChannelData(0);
    for(let i=0;i<data.length;i++)data[i]=fillSample(i/rate,i,rate);
    return buffer;
  }

  let meowPhase=0;
  const meowBuffer=makeBuffer(.72,(t,i,rate)=>{
    let f;
    if(t<.11)f=520+(790-520)*(t/.11);
    else if(t<.34)f=790+35*Math.sin((t-.11)*Math.PI*5.2);
    else f=790-(790-410)*((t-.34)/.38);
    f*=1+.014*Math.sin(Math.PI*2*6.4*t);
    meowPhase+=Math.PI*2*f/rate;
    const attack=Math.min(1,t/.018);
    const release=Math.min(1,(.72-t)/.17);
    const env=Math.sin(attack*Math.PI/2)*Math.sin(release*Math.PI/2);
    const voice=
      Math.sin(meowPhase)+
      .36*Math.sin(meowPhase*2)+
      .17*Math.sin(meowPhase*3)+
      .08*Math.sin(meowPhase*4);
    return Math.tanh(voice*.9)*env*.58;
  });

  // Low, rhythmic two-part rumble approximating feline inhalation/exhalation.
  let purrPhase=0;
  const purrBuffer=makeBuffer(4.0,(t,i,rate)=>{
    const breath=.52+.48*Math.pow(Math.sin(Math.PI*2*1.35*t),2);
    const f=27+2.2*Math.sin(Math.PI*2*.8*t);
    purrPhase+=Math.PI*2*f/rate;
    const harmonic=
      Math.sin(purrPhase)+
      .42*Math.sin(purrPhase*2)+
      .18*Math.sin(purrPhase*3);
    const grain=Math.sin(Math.PI*2*(72+5*Math.sin(t*2))*t)*.08;
    const attack=Math.min(1,t/.08);
    const release=Math.min(1,(4-t)/.25);
    return Math.tanh((harmonic+grain)*1.1)*breath*attack*release*.28;
  });

  function playBuffer(buffer,volume=1){
    if(!sfxCtx||!buffer)return null;
    if(sfxCtx.state==='suspended')sfxCtx.resume();
    const src=sfxCtx.createBufferSource();
    const gain=sfxCtx.createGain();
    gain.gain.value=volume;
    src.buffer=buffer;
    src.connect(gain);
    gain.connect(sfxCtx.destination);
    src.start(sfxCtx.currentTime);
    return src;
  }

  function playMeow(){
    if(customOpen||settingsOpen)return;
    markActive();
    meowMouthUntil=performance.now()+620;
    // No pause(), seek or shared Audio element: every press is independent.
    playBuffer(meowBuffer,1);
  }

  function playPurr(){
    if(customOpen||settingsOpen)return;
    markActive();
    purrUntil=Math.max(purrUntil,performance.now()+4000);
    playBuffer(purrBuffer,1);
  }

  const meowBtn=document.getElementById('meow');
  meowBtn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    playMeow();
  });

  const purrBtn=document.getElementById('purr');
  purrBtn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    playPurr();
  });

  document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();
    if(!customOpen && !settingsOpen && onGround && lifeStage!=='Newborn'){
      markActive();
      // Kittens start with a smaller hop and gain jump strength as they mature.
      const jumpStrength=mix(2.85,3.95,ageAdultness)*(lifeStage==='Senior'?.86:1);
      vy=jumpStrength;
      onGround=false;
    }
  });

  let lookId=null,lastX=0;
  renderer.domElement.addEventListener('pointerdown',e=>{
    if(customOpen||settingsOpen)return;
    markActive();
    lookId=e.pointerId;
    lastX=e.clientX;
    renderer.domElement.setPointerCapture(lookId);
  });
  renderer.domElement.addEventListener('pointermove',e=>{
    if(e.pointerId===lookId){

      lastX=e.clientX;
    }
  });
  renderer.domElement.addEventListener('pointerup',e=>{
    if(e.pointerId===lookId)lookId=null;
  });
  renderer.domElement.addEventListener('pointercancel',e=>{
    if(e.pointerId===lookId)lookId=null;
  });

  function angleDelta(a,b){
    return Math.atan2(Math.sin(b-a),Math.cos(b-a));
  }

  const clock=new THREE.Clock();
  const camPos=new THREE.Vector3();
  status.textContent='Test Room • Cat ready';

  function animate(){
    requestAnimationFrame(animate);
    resizeRenderer();
    const dt=Math.min(clock.getDelta(),.033);

    if(!customOpen&&!settingsOpen)ageWeeks+=AGE_WEEKS_PER_SECOND*dt;
    updateGrowth();

    const inputMag=Math.min(1,Math.hypot(move.x,move.y));
    const moving=!customOpen && !settingsOpen && inputMag>.06;

    let desiredSpeed=0;
    if(moving && lifeStage!=='Newborn'){
      // Young kittens are slower; speed and coordination improve with age.
      const youthMove=mix(.66,1.0,ageAdultness);
      const seniorMove=lifeStage==='Senior'?.78:1;
      const walkSpeed=1.75*youthMove*seniorMove;
      const runSpeed=4.35*youthMove*seniorMove;

      // Running drains stamina fastest when young. Walking always remains available.
      if(runHeld && !tired){
        stamina-=dt*mix(.22,.10,ageAdultness);
      }else{
        stamina+=dt*mix(.18,.26,ageAdultness);
      }
      stamina=Math.max(0,Math.min(1,stamina));
      if(stamina<=.03)tired=true;
      if(stamina>=.40)tired=false;

      desiredSpeed=((runHeld&&!tired)?runSpeed:walkSpeed)*inputMag;
    }else{
      stamina=Math.min(1,stamina+dt*.24);
    }

    const accel=moving?mix(4.3,6.8,ageAdultness):7.6;
    const speedStep=accel*dt;
    if(currentSpeed<desiredSpeed)currentSpeed=Math.min(desiredSpeed,currentSpeed+speedStep);
    else currentSpeed=Math.max(desiredSpeed,currentSpeed-speedStep);

    if(moving){
      const forward=-move.y;
      const right=-move.x;
      const desiredAngle=cameraYaw+Math.atan2(right,forward);

      // Smooth body rotation instead of snapping.
      cat.rotation.y+=angleDelta(cat.rotation.y,desiredAngle)*Math.min(1,9*dt);

      // Movement follows input direction immediately while body catches up visually.
      cat.position.x+=Math.sin(desiredAngle)*currentSpeed*dt;
      cat.position.z+=Math.cos(desiredAngle)*currentSpeed*dt;
    }

    cat.position.x=Math.max(-7.3,Math.min(7.3,cat.position.x));
    cat.position.z=Math.max(-7.3,Math.min(7.3,cat.position.z));

    // Jump / gravity. Very young cats have a softer, shorter arc.
    const gravity=mix(8.1,8.9,ageAdultness);
    vy-=gravity*dt;
    cat.position.y+=vy*dt;
    if(cat.position.y<=0){
      cat.position.y=0;
      vy=0;
      onGround=true;
    }

    // Feline locomotion: a planted four-beat walk and a springier galloping run.
    const adultRun=4.35;
    const gait=Math.min(1,currentSpeed/adultRun);
    const youth=1-ageAdultness;

    if(currentSpeed>.08 && onGround){
      stopGrooming();
      idleSeconds=0;

      const running=runHeld && !tired && currentSpeed>2.0;
      movePhase+=dt*(running?12.4:6.0)*(0.58+gait*.72);

      // Array order is front-left, front-right, hind-left, hind-right.
      // Walk order: hind-left -> front-left -> hind-right -> front-right.
      const walkOffsets=[.25,.75,0,.50];
      // Run/gallop: rear legs drive first, front legs catch and extend.
      const runOffsets=[.56,.64,.06,0];

      legs.forEach((leg,i)=>{
        const offset=running?runOffsets[i]:walkOffsets[i];
        const cycle=((movePhase/(Math.PI*2))+offset)%1;
        const stancePortion=running?.56:.68;
        let swing, lift;

        if(cycle<stancePortion){
          const u=cycle/stancePortion;
          // Paw remains comparatively planted while the body passes over it.
          swing=mix(.34,-.30,u);
          lift=0;
        }else{
          const u=(cycle-stancePortion)/(1-stancePortion);
          // Quick recovery stroke: paw folds, lifts, then reaches forward.
          swing=mix(-.30,.34,u);
          lift=Math.sin(u*Math.PI);
        }

        const front=leg.userData.isFront;
        const amp=running?1.22:.78;
        leg.rotation.x+=(swing*amp-leg.rotation.x)*Math.min(1,(running?18:13)*dt);

        const upper=leg.userData.upper;
        const lower=leg.userData.lower;
        const paw=leg.userData.paw;

        const upperTarget=swing*(front?.34:.44)+(front?-.02:.04);
        const lowerFold=front?(running?.72:.50):(running?.90:.62);
        const lowerTarget=-lift*lowerFold+(front?-.06:.10);
        const pawTarget=lift*(front?.34:.42);

        upper.rotation.x+=(upperTarget-upper.rotation.x)*Math.min(1,18*dt);
        lower.rotation.x+=(lowerTarget-lower.rotation.x)*Math.min(1,20*dt);
        paw.rotation.x+=(pawTarget-paw.rotation.x)*Math.min(1,22*dt);
        paw.position.y+=((-.405+lift*(running?.075:.045))-paw.position.y)*Math.min(1,22*dt);
        paw.position.z+=((.055 + swing*(front?.025:.035))-paw.position.z)*Math.min(1,18*dt);
      });

      // The shoulder girdle and pelvis rise at different times as weight transfers.
      const strideWave=Math.sin(movePhase);
      const doubleWave=Math.sin(movePhase*2);
      const shoulderWave=Math.sin(movePhase*2+.72);
      const hipWave=Math.sin(movePhase*2-.62);
      const bounce=(running?.034:.014)*gait;

      shoulders.position.y=.56+shoulderWave*bounce;
      haunches.position.y=.55+hipWave*bounce*.82;
      torso.position.y=.53+doubleWave*bounce*.42;

      // Run flexes and extends through the spine; walk keeps it much subtler.
      const spineFlex=(running?.060:.018)*strideWave*gait;
      const baseTorsoZ=mix(.98,.92,youth);
      torso.scale.z+=(baseTorsoZ+spineFlex-torso.scale.z)*Math.min(1,13*dt);
      shoulders.position.z=.34-(running?strideWave*.020:strideWave*.006)*gait;
      haunches.position.z=-.32+(running?strideWave*.028:strideWave*.008)*gait;

      neck.rotation.x+=(Math.sin(movePhase*2+.4)*.028*gait-neck.rotation.x)*Math.min(1,12*dt);
      head.position.y=(lifeStage==='Senior'?.765:.79)+shoulderWave*bounce*.48;
      head.rotation.x+=(Math.sin(movePhase*2+.9)*.018*gait-head.rotation.x)*Math.min(1,12*dt);

      // Counter-rotation of shoulders and pelvis gives the body a cat-like flowing gait.
      torso.rotation.y=Math.sin(movePhase)*.028*gait;
      shoulders.rotation.y=-Math.sin(movePhase)*.052*gait;
      haunches.rotation.y=Math.sin(movePhase)*.068*gait;
      catRig.rotation.z=Math.sin(movePhase)*.012*gait+
                        Math.sin(movePhase*.5)*.014*youth*gait;
    }else{
      for(const leg of legs){
        leg.rotation.x*=Math.max(0,1-11*dt);
        leg.userData.upper.rotation.x*=Math.max(0,1-12*dt);
        leg.userData.lower.rotation.x*=Math.max(0,1-13*dt);
        leg.userData.paw.rotation.x*=Math.max(0,1-14*dt);
        leg.userData.paw.position.y+=(-.405-leg.userData.paw.position.y)*Math.min(1,14*dt);
        leg.userData.paw.position.z+=(.055-leg.userData.paw.position.z)*Math.min(1,14*dt);
      }
      torso.position.y+=(.53-torso.position.y)*Math.min(1,8*dt);
      shoulders.position.y+=(.56-shoulders.position.y)*Math.min(1,8*dt);
      haunches.position.y+=(.55-haunches.position.y)*Math.min(1,8*dt);
      shoulders.position.z+=(.34-shoulders.position.z)*Math.min(1,8*dt);
      haunches.position.z+=(-.32-haunches.position.z)*Math.min(1,8*dt);
      torso.rotation.y*=Math.max(0,1-7*dt);
      shoulders.rotation.y*=Math.max(0,1-7*dt);
      haunches.rotation.y*=Math.max(0,1-7*dt);
      neck.rotation.x*=Math.max(0,1-7*dt);
      const restingHeadY=lifeStage==='Senior'?.765:.79;
      head.position.y+=(restingHeadY-head.position.y)*Math.min(1,8*dt);
      catRig.rotation.z*=Math.max(0,1-6*dt);
      catRig.rotation.x*=Math.max(0,1-6*dt);
    }

    // Tuck legs slightly in the air.
    if(!onGround){
      for(let i=0;i<legs.length;i++){
        const target=legs[i].userData.isFront?-.28:.30;
        legs[i].rotation.x+=(target-legs[i].rotation.x)*Math.min(1,8*dt);
        legs[i].userData.lower.rotation.x+=(-.42-legs[i].userData.lower.rotation.x)*Math.min(1,8*dt);
        legs[i].userData.paw.rotation.x+=(.22-legs[i].userData.paw.rotation.x)*Math.min(1,8*dt);
      }
    }

    // --- Idle grooming ---
    // After five seconds with no movement/input, pick a different cat grooming
    // behaviour at random. Any player activity immediately interrupts it.
    const genuinelyIdle=!customOpen && !settingsOpen && onGround && currentSpeed<.035 && !moving;
    if(genuinelyIdle){
      idleSeconds+=dt;
    }else{
      idleSeconds=0;
      stopGrooming();
    }

    if(!grooming && genuinelyIdle && idleSeconds>=nextGroomDelay){
      const choices=['face','flank','privates','frontPaw','chest','earScratch','shoulder'];
      grooming=choices[Math.floor(Math.random()*choices.length)];
      groomingTime=0;
      groomingDuration=3.2+Math.random()*2.2;
      groomingSide=Math.random()<.5?-1:1;
      idleSeconds=0;
    }

    // Reset the lick prop every frame; active grooming poses turn it back on.
    tongue.visible=false;

    if(grooming){
      groomingTime+=dt;
      const g=groomingTime;
      const lickWave=Math.sin(g*11.5);
      const lickPulse=Math.max(0,Math.sin(g*11.5));
      const slow=Math.sin(g*3.0);
      const frontLeg=groomingSide<0?legs[0]:legs[1];
      const otherFront=groomingSide<0?legs[1]:legs[0];
      const hindLeg=groomingSide<0?legs[2]:legs[3];

      // Make the whole kitten visibly settle into a grooming posture first.
      catRig.rotation.x+=(-.055-catRig.rotation.x)*Math.min(1,7*dt);
      torso.position.y+=(.485-torso.position.y)*Math.min(1,7*dt);
      shoulders.position.y+=(.515-shoulders.position.y)*Math.min(1,7*dt);
      haunches.position.y+=(.505-haunches.position.y)*Math.min(1,7*dt);
      tailRoot.rotation.y+=((groomingSide*.20)-tailRoot.rotation.y)*Math.min(1,5*dt);

      const lickTongue=()=>{
        tongue.visible=lickPulse>.18;
        tongue.position.y=-.170-lickPulse*.022;
        tongue.position.z=.327+lickPulse*.025;
        tongue.scale.y=.18+lickPulse*.34;
        mouth.scale.y+=(.34-mouth.scale.y)*Math.min(1,16*dt);
      };

      if(grooming==='face'){
        // Classic cat face wash: lick paw, then sweep it over cheek/ear.
        const wipe=Math.sin(g*4.8);
        frontLeg.rotation.x+=(-1.12+wipe*.16-frontLeg.rotation.x)*Math.min(1,12*dt);
        frontLeg.userData.upper.rotation.x+=(-.55-frontLeg.userData.upper.rotation.x)*Math.min(1,14*dt);
        frontLeg.userData.lower.rotation.x+=(-1.02-frontLeg.userData.lower.rotation.x)*Math.min(1,15*dt);
        frontLeg.userData.paw.rotation.x+=(.88+wipe*.18-frontLeg.userData.paw.rotation.x)*Math.min(1,16*dt);
        otherFront.rotation.x+=(.10-otherFront.rotation.x)*Math.min(1,9*dt);
        head.rotation.y+=(groomingSide*(.30+wipe*.12)-head.rotation.y)*Math.min(1,12*dt);
        head.rotation.x+=(-.24+Math.abs(wipe)*.10-head.rotation.x)*Math.min(1,12*dt);
        head.rotation.z+=(-groomingSide*(.18+wipe*.08)-head.rotation.z)*Math.min(1,12*dt);
        lickTongue();
      }else if(grooming==='flank'){
        // Strong curl through spine and neck to reach the side of the body.
        catRig.rotation.z+=(groomingSide*.10-catRig.rotation.z)*Math.min(1,8*dt);
        torso.rotation.y+=(groomingSide*.35-torso.rotation.y)*Math.min(1,10*dt);
        shoulders.rotation.y+=(-groomingSide*.24-shoulders.rotation.y)*Math.min(1,10*dt);
        haunches.rotation.y+=(groomingSide*.30-haunches.rotation.y)*Math.min(1,10*dt);
        neck.rotation.y+=(groomingSide*.58-neck.rotation.y)*Math.min(1,10*dt);
        head.rotation.y+=(groomingSide*1.15-head.rotation.y)*Math.min(1,11*dt);
        head.rotation.x+=(-.48+lickWave*.10-head.rotation.x)*Math.min(1,13*dt);
        head.position.y+=(.72-head.position.y)*Math.min(1,8*dt);
        lickTongue();
      }else if(grooming==='privates'){
        // Sit deeper, lift one hind leg and fold the head toward the belly.
        catRig.rotation.x+=(-.13-catRig.rotation.x)*Math.min(1,9*dt);
        haunches.position.y+=(.45-haunches.position.y)*Math.min(1,9*dt);
        const hindTarget=groomingSide < 0 ? 0.86 : -0.86;
        hindLeg.rotation.x+=(hindTarget-hindLeg.rotation.x)*Math.min(1,11*dt);
        hindLeg.rotation.z+=(-groomingSide*.42-hindLeg.rotation.z)*Math.min(1,11*dt);
        hindLeg.userData.lower.rotation.x+=(-.86-hindLeg.userData.lower.rotation.x)*Math.min(1,12*dt);
        head.rotation.x+=(-.90+lickWave*.08-head.rotation.x)*Math.min(1,12*dt);
        head.rotation.y+=(groomingSide*.42-head.rotation.y)*Math.min(1,11*dt);
        head.position.y+=(.665-head.position.y)*Math.min(1,9*dt);
        lickTongue();
      }else if(grooming==='frontPaw'){
        frontLeg.rotation.x+=(-.96-frontLeg.rotation.x)*Math.min(1,12*dt);
        frontLeg.userData.upper.rotation.x+=(-.40-frontLeg.userData.upper.rotation.x)*Math.min(1,13*dt);
        frontLeg.userData.lower.rotation.x+=(-.88-frontLeg.userData.lower.rotation.x)*Math.min(1,14*dt);
        frontLeg.userData.paw.rotation.x+=(.76-frontLeg.userData.paw.rotation.x)*Math.min(1,15*dt);
        head.rotation.y+=(groomingSide*.30-head.rotation.y)*Math.min(1,11*dt);
        head.rotation.x+=(-.56+lickWave*.11-head.rotation.x)*Math.min(1,13*dt);
        lickTongue();
      }else if(grooming==='chest'){
        shoulders.position.y+=(.49-shoulders.position.y)*Math.min(1,8*dt);
        neck.rotation.x+=(-.30-neck.rotation.x)*Math.min(1,11*dt);
        head.rotation.x+=(-.78+lickWave*.12-head.rotation.x)*Math.min(1,13*dt);
        head.rotation.y+=(slow*.08-head.rotation.y)*Math.min(1,11*dt);
        head.position.y+=(.69-head.position.y)*Math.min(1,9*dt);
        lickTongue();
      }else if(grooming==='earScratch'){
        // One hind leg comes right up beside the ear and rapidly scratches.
        const scratch=Math.sin(g*22);
        hindLeg.rotation.x+=(-1.20-hindLeg.rotation.x)*Math.min(1,13*dt);
        hindLeg.rotation.z+=(-groomingSide*.58-hindLeg.rotation.z)*Math.min(1,13*dt);
        hindLeg.userData.upper.rotation.x+=(-.66-hindLeg.userData.upper.rotation.x)*Math.min(1,14*dt);
        hindLeg.userData.lower.rotation.x+=(-1.04-hindLeg.userData.lower.rotation.x)*Math.min(1,16*dt);
        hindLeg.userData.paw.rotation.x+=(scratch*.72-hindLeg.userData.paw.rotation.x)*Math.min(1,22*dt);
        head.rotation.z+=(-groomingSide*.36-head.rotation.z)*Math.min(1,12*dt);
        head.rotation.y+=(groomingSide*.22-head.rotation.y)*Math.min(1,11*dt);
        earL.rotation.z+=((groomingSide<0?-.22:-.08)-earL.rotation.z)*Math.min(1,14*dt);
        earR.rotation.z+=((groomingSide>0?.22:.08)-earR.rotation.z)*Math.min(1,14*dt);
      }else if(grooming==='shoulder'){
        torso.rotation.y+=(groomingSide*.18-torso.rotation.y)*Math.min(1,9*dt);
        shoulders.rotation.y+=(-groomingSide*.22-shoulders.rotation.y)*Math.min(1,10*dt);
        neck.rotation.y+=(groomingSide*.38-neck.rotation.y)*Math.min(1,10*dt);
        head.rotation.y+=(groomingSide*.82-head.rotation.y)*Math.min(1,11*dt);
        head.rotation.x+=(-.44+lickWave*.11-head.rotation.x)*Math.min(1,13*dt);
        lickTongue();
      }

      if(groomingTime>=groomingDuration){
        stopGrooming();
        nextGroomDelay=3.5+Math.random()*4.0;
        idleSeconds=0;
      }
    }

    // Upright, expressive tail with a travelling sway from base to tip.
    const t=performance.now()*.001;
    idlePhase+=dt;
    const youthIdle=1-ageAdultness;

    const tailBaseTarget=1.02 + (moving?.12:.20);
    tailRoot.rotation.x+=(tailBaseTarget-tailRoot.rotation.x)*Math.min(1,6*dt);
    tailRoot.rotation.y=Math.sin(t*(1.25+youthIdle*.45))*(moving?.14:.24);

    tailSegments.forEach((seg,i)=>{
      const along=i/Math.max(1,tailSegments.length-1);
      seg.rotation.y=
        Math.sin(t*1.75-i*.55)*(0.06+along*.16) +
        (moving?Math.sin(movePhase*.45-i*.25)*.045:0);
      // The upper section curls gently back instead of pointing like a rigid pole.
      seg.rotation.x=-.055-(along*.065);
    });

    const idleCuriosity=!moving&&onGround&&!grooming ? youthIdle : 0;
    const purring=performance.now()<purrUntil;
    if(purring && onGround){
      // Tiny chest/head vibration while purring.
      chest.scale.y+=(1.10+Math.sin(t*27)*.025-chest.scale.y)*Math.min(1,18*dt);
      head.position.y+=Math.sin(t*28)*.0025;
    }else{
      chest.scale.y+=(1.10-chest.scale.y)*Math.min(1,10*dt);
    }
    if(!grooming){
      head.rotation.y=Math.sin(t*.72)*.055*idleCuriosity;
      if(currentSpeed<=.08)head.rotation.x=Math.sin(t*.91)*.025*idleCuriosity;
      head.rotation.z=Math.sin(movePhase)*.010*gait + Math.sin(t*.63)*.012*idleCuriosity;
      earL.rotation.z=-.08+Math.sin(t*2.3)*.025*idleCuriosity;
      earR.rotation.z=.08-Math.sin(t*2.0+.8)*.025*idleCuriosity;
    }

    // Tiny visible mouth opening while the meow plays.
    const meowing=performance.now()<meowMouthUntil;
    mouth.scale.y+=( (meowing?.72:.16)-mouth.scale.y )*Math.min(1,18*dt);
    mouth.position.y+=( (meowing?-.157:-.145)-mouth.position.y )*Math.min(1,18*dt);

    // Cat-height camera. Customisation brings it closer for a live preview.
    const targetHeight=mix(.36,.64,ageAdultness);
    const target=cat.position.clone().add(new THREE.Vector3(0,targetHeight,0));
    const dist=customOpen?mix(1.55,1.95,ageAdultness):mix(2.35,3.05,ageAdultness);
    const cameraLift=customOpen?mix(.70,.95,ageAdultness):mix(.98,1.42,ageAdultness);
    const desiredCam=target.clone().add(
      new THREE.Vector3(
        Math.sin(cameraYaw)*-dist,
        cameraLift,
        Math.cos(cameraYaw)*-dist
      )
    );
    const camBlend=1-Math.pow(.001,dt);
    camera.position.lerp(desiredCam,camBlend);
    camera.lookAt(target);

    if(customOpen)status.textContent='Customising kitten';
    else if(performance.now()<meowMouthUntil)status.textContent='Test Room • Meow!';
    else if(performance.now()<purrUntil)status.textContent='Test Room • Purring';
    else if(grooming==='face')status.textContent='Test Room • Washing face';
    else if(grooming==='flank')status.textContent='Test Room • Washing flank';
    else if(grooming==='privates')status.textContent='Test Room • Grooming';
    else if(grooming==='frontPaw')status.textContent='Test Room • Washing paw';
    else if(grooming==='chest')status.textContent='Test Room • Washing chest';
    else if(grooming==='earScratch')status.textContent='Test Room • Scratching ear';
    else if(grooming==='shoulder')status.textContent='Test Room • Washing shoulder';
    else if(!onGround)status.textContent='Test Room • Jumping';
    else if(tired && runHeld)status.textContent='Test Room • Little legs are tired';
    else if(currentSpeed>2.5)status.textContent='Test Room • Running';
    else if(currentSpeed>.12)status.textContent='Test Room • Walking';
    else status.textContent='Test Room • '+lifeStage;

    renderer.render(scene,camera);
  }

  animate();

  addEventListener('resize',()=>resizeRenderer(true));
  addEventListener('orientationchange',()=>setTimeout(()=>resizeRenderer(true),150));

}catch(e){
  status.textContent='3D load failed';
  document.body.insertAdjacentHTML(
    'beforeend',
    '<div style="position:fixed;top:45%;left:10%;right:10%;padding:18px;background:#fff;color:#222;border-radius:14px;text-align:center">Could not load the 3D engine.<br><small>'+String(e.message).replaceAll('<','&lt;')+'</small></div>'
  );
}
</script>
</body>
</html>
